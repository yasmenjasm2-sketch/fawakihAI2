<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <title>مركز الدعم الفني - FawakihAI</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-grad-1: #05050A;
            --bg-grad-2: #080812;
            --bg-grad-3: #0A0A15;
            --header-bg: #11081F;
            --primary-accent: #B026FF;
            --user-bubble-1: #B026FF;
            --user-bubble-2: #8015C2;
            --admin-bubble-bg: #11081F;
            --input-bg: #0A0512;
            --text-main: #FFFFFF;
            --text-muted: #9CA3AF;
            --text-highlight: #D8B4FE;
            --success: #34D399;
            --danger: #F87171;
            --warning: #FBBF24;
            --orb-opacity: 0.15;
            --toast-bg: rgba(17, 8, 31, 0.95);
        }

        :root[data-theme="light"] {
            --bg-grad-1: #F8F5FF;
            --bg-grad-2: #F1EAFF;
            --bg-grad-3: #E9DEFF;
            --header-bg: #FFFFFF;
            --primary-accent: #8A1DD9;
            --user-bubble-1: #B026FF;
            --user-bubble-2: #8015C2;
            --admin-bubble-bg: #F5EEFF;
            --input-bg: #FFFFFF;
            --text-main: #1A0B2E;
            --text-muted: #6B5B7F;
            --text-highlight: #7B1FB8;
            --success: #059669;
            --danger: #DC2626;
            --warning: #D97706;
            --orb-opacity: 0.25;
            --toast-bg: rgba(255, 255, 255, 0.97);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100dvh;
            width: 100%;
            overflow: hidden;
            background: var(--bg-grad-1);
            color: var(--text-main);
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #app-container {
            width: 100%;
            max-width: 600px;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, var(--bg-grad-1), var(--bg-grad-2), var(--bg-grad-3));
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            overflow: hidden;
            transition: background 0.4s ease;
        }

        #app-container::before,
        #app-container::after {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(176, 38, 255, var(--orb-opacity)) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
            transition: background 0.4s ease;
        }
        #app-container::before {
            top: -180px;
            right: -120px;
            animation: floatOrb 16s ease-in-out infinite;
        }
        #app-container::after {
            bottom: -180px;
            left: -120px;
            animation: floatOrb 20s ease-in-out infinite reverse;
        }
        @keyframes floatOrb {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(35px, 45px) scale(1.25); }
        }

        .header {
            background: var(--header-bg);
            padding: 15px 20px;
            border-radius: 0 0 25px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 5px 20px rgba(176, 38, 255, 0.15);
            z-index: 10;
            position: relative;
            border-bottom: 2px solid rgba(176, 38, 255, 0.3);
            flex-shrink: 0;
            gap: 10px;
            transition: background 0.4s ease, color 0.4s ease, border-color 0.4s ease;
        }

        .header-info {
            display: flex;
            align-items: center;
            gap: 15px;
            min-width: 0;
        }

        .avatar-wrapper {
            position: relative;
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .avatar-wrapper::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent, var(--primary-accent), transparent, var(--primary-accent), transparent);
            animation: rotateRing 4s linear infinite;
            z-index: 0;
            filter: blur(1px);
        }
        @keyframes rotateRing {
            to { transform: rotate(360deg); }
        }

        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid var(--header-bg);
            object-fit: cover;
            background-color: var(--bg-grad-1);
            position: relative;
            z-index: 1;
            animation: avatarPulse 2.4s ease-in-out infinite;
            display: block;
        }
        .avatar.avatar-fallback {
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-highlight);
        }
        @keyframes avatarPulse {
            0%, 100% { box-shadow: 0 0 10px rgba(176, 38, 255, 0.4); }
            50% { box-shadow: 0 0 20px rgba(176, 38, 255, 0.9), 0 0 32px rgba(176, 38, 255, 0.5); }
        }

        .header-text {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .header-title {
            font-size: 1.05rem;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-status {
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--success);
            text-shadow: 0 0 8px rgba(52, 211, 153, 0.3);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 8px var(--success);
            animation: statusPulse 1.5s ease-in-out infinite;
        }
        @keyframes statusPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.35); }
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .icon-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: rgba(176, 38, 255, 0.15);
            color: var(--text-highlight);
            border: 1px solid rgba(176, 38, 255, 0.3);
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .icon-btn svg { display: block; }
        .icon-btn:hover {
            background: rgba(176, 38, 255, 0.3);
            transform: scale(1.1);
        }
        .icon-btn:active {
            transform: scale(0.9);
        }
        .icon-btn.danger:hover {
            background: rgba(248, 113, 113, 0.3);
            border-color: var(--danger);
            color: var(--danger);
        }

        .chat-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 15px 15px;
            display: flex;
            flex-direction: column;
            scroll-behavior: smooth;
            position: relative;
            z-index: 1;
        }

        .chat-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .chat-scroll::-webkit-scrollbar-thumb {
            background: rgba(176, 38, 255, 0.3);
            border-radius: 5px;
        }

        .message-row {
            display: flex;
            margin-bottom: 20px;
            width: 100%;
            opacity: 0;
            transform: translateY(28px) scale(0.95);
            filter: blur(3px);
            transition: opacity 0.55s cubic-bezier(0.22, 1, 0.36, 1),
                        transform 0.55s cubic-bezier(0.22, 1, 0.36, 1),
                        filter 0.5s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: opacity, transform, filter;
        }
        .message-row.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
            filter: blur(0);
        }

        .msg-user {
            justify-content: flex-start;
        }

        .msg-admin {
            justify-content: flex-end;
        }

        .bubble {
            max-width: 85%;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.25);
            word-wrap: break-word;
            position: relative;
        }

        .bubble-user {
            background: linear-gradient(135deg, var(--user-bubble-1), var(--user-bubble-2));
            border-radius: 20px 20px 20px 0;
            margin-left: 20px;
            box-shadow: 0 4px 15px rgba(176, 38, 255, 0.2);
        }

        .bubble-admin {
            background: var(--admin-bubble-bg);
            border: 1px solid rgba(176, 38, 255, 0.2);
            border-radius: 20px 20px 0 20px;
            margin-right: 10px;
            animation: adminGlow 3s ease-in-out infinite;
            transition: background 0.4s ease, border-color 0.4s ease;
        }
        @keyframes adminGlow {
            0%, 100% { border-color: rgba(176, 38, 255, 0.2); }
            50% { border-color: rgba(176, 38, 255, 0.5); }
        }

        .admin-avatar-small {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 1px solid var(--primary-accent);
            align-self: flex-end;
            object-fit: cover;
            margin-left: 8px;
            box-shadow: 0 0 8px rgba(176, 38, 255, 0.4);
            background: linear-gradient(135deg, var(--primary-accent), #7A12C1);
            flex-shrink: 0;
        }
        .admin-avatar-small.avatar-fallback {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .msg-text {
            font-size: 0.95rem;
            line-height: 1.55;
            transition: max-height 0.4s ease;
        }

        .msg-text.collapsed {
            max-height: 200px;
            overflow: hidden;
            position: relative;
            mask-image: linear-gradient(to bottom, #000 70%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, #000 70%, transparent 100%);
        }

        /* مؤشر الستريمنغ للردود */
        .msg-text.streaming::after {
            content: '';
            display: inline-block;
            width: 2px;
            height: 1em;
            background: var(--primary-accent);
            margin-right: 3px;
            vertical-align: text-bottom;
            animation: blinkCursor 0.8s step-end infinite;
            border-radius: 1px;
        }
        @keyframes blinkCursor {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .bubble-admin .msg-text p { margin-bottom: 8px; }
        .bubble-admin .msg-text p:last-child { margin-bottom: 0; }
        .bubble-admin .msg-text ul, 
        .bubble-admin .msg-text ol { margin: 8px 0; padding-right: 20px; }
        .bubble-admin .msg-text li { margin-bottom: 4px; }
        .bubble-admin .msg-text strong { color: var(--text-highlight); }
        .bubble-admin .msg-text code {
            background: rgba(0,0,0,0.3);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.85rem;
            color: var(--text-highlight);
        }
        :root[data-theme="light"] .bubble-admin .msg-text code {
            background: rgba(123, 31, 184, 0.1);
        }

        .msg-time {
            font-size: 0.65rem;
            align-self: flex-end;
            margin-top: 5px;
            opacity: 0.8;
        }

        .bubble-user .msg-time { color: #F3E8FF; }
        .bubble-admin .msg-time { color: var(--text-muted); align-self: flex-start; }

        .admin-name {
            font-size: 0.8rem;
            color: var(--primary-accent);
            font-weight: 700;
            margin-bottom: 4px;
        }

        .msg-image {
            max-width: 100%;
            border-radius: 12px;
            margin-bottom: 8px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .link-btn {
            background: rgba(176, 38, 255, 0.2);
            border: 1px solid var(--primary-accent);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 15px;
            text-decoration: none;
            font-size: 0.85rem;
            text-align: center;
            margin-top: 8px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.25s;
        }
        .link-btn:hover {
            background: rgba(176, 38, 255, 0.45);
            transform: translateY(-2px);
        }

        .bubble-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-top: 6px;
            width: 100%;
        }

        .copy-btn, .read-more-btn {
            background: rgba(176, 38, 255, 0.15);
            border: 1px solid rgba(176, 38, 255, 0.35);
            color: var(--text-highlight);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.72rem;
            cursor: pointer;
            font-family: inherit;
            font-weight: 700;
            transition: all 0.25s;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .copy-btn:hover, .read-more-btn:hover {
            background: rgba(176, 38, 255, 0.3);
            transform: scale(1.04);
        }
        .copy-btn:active, .read-more-btn:active {
            transform: scale(0.95);
        }
        .copy-btn:disabled {
            cursor: default;
            opacity: 0.9;
        }
        .read-more-btn {
            align-self: flex-start;
            margin-top: 6px;
            margin-bottom: 4px;
        }

        .typing-indicator {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 4px;
        }
        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary-accent);
            box-shadow: 0 0 8px rgba(176, 38, 255, 0.7);
            animation: typingBounce 1.4s infinite ease-in-out;
        }
        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-7px); opacity: 1; }
        }
        .typing-eta {
            font-size: 0.68rem;
            color: var(--text-muted);
            margin-right: 8px;
            opacity: 0.75;
            font-weight: 600;
        }

        .welcome-msg {
            text-align: center;
            color: var(--text-muted);
            margin-top: 30px;
            line-height: 1.9;
            padding: 20px;
            animation: floatText 3.5s ease-in-out infinite;
        }
        .welcome-icon {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-accent);
            animation: iconFloat 3s ease-in-out infinite;
        }
        @keyframes floatText {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        @keyframes iconFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(4deg); }
        }

        .quick-replies {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 5px 15px 25px;
            justify-content: center;
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .quick-replies button {
            background: rgba(176, 38, 255, 0.12);
            border: 1px solid rgba(176, 38, 255, 0.4);
            color: var(--text-highlight);
            padding: 9px 15px;
            border-radius: 20px;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .quick-replies button svg { display: block; flex-shrink: 0; }
        .quick-replies button:hover {
            background: rgba(176, 38, 255, 0.28);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(176, 38, 255, 0.25);
        }
        .quick-replies button:active {
            transform: scale(0.94);
        }

        .ai-feedback-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: rgba(176, 38, 255, 0.05);
            border: 1px dashed rgba(176, 38, 255, 0.35);
            border-radius: 18px;
            margin: 0 20px 20px auto;
            max-width: 88%;
            justify-content: flex-end;
            animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            direction: rtl;
        }

        .feedback-q {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .fb-btn {
            background: rgba(176, 38, 255, 0.12);
            border: 1px solid rgba(176, 38, 255, 0.4);
            color: var(--text-main);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-family: inherit;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .fb-btn svg { display: block; }
        .fb-btn:hover { transform: scale(1.08); }
        .fb-btn:active { transform: scale(0.9); }
        .fb-yes:hover {
            background: rgba(52, 211, 153, 0.3);
            border-color: var(--success);
            color: var(--success);
        }
        .fb-no:hover {
            background: rgba(248, 113, 113, 0.3);
            border-color: var(--danger);
            color: var(--danger);
        }
        @keyframes popIn {
            from { transform: scale(0.6); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .system-transfer-row {
            display: flex;
            justify-content: center;
            margin: 15px 0 20px 0;
            width: 100%;
            animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .system-transfer-msg {
            text-align: center;
            padding: 16px 22px;
            background: linear-gradient(135deg, rgba(52, 211, 153, 0.08), rgba(176, 38, 255, 0.08));
            border: 1px solid rgba(52, 211, 153, 0.45);
            border-radius: 22px;
            max-width: 90%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 4px 20px rgba(52, 211, 153, 0.15);
            align-items: center;
        }
        .sys-icon {
            color: var(--primary-accent);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .sys-main {
            color: var(--success);
            font-weight: 700;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .sys-sub {
            color: var(--text-highlight);
            font-weight: 600;
            font-size: 0.9rem;
        }

        .input-area {
            background: var(--header-bg);
            padding: 10px 15px;
            border-radius: 30px 30px 0 0;
            display: flex;
            flex-direction: column;
            box-shadow: 0 -5px 25px rgba(0,0,0,0.3);
            border-top: 1px solid rgba(176, 38, 255, 0.15);
            flex-shrink: 0;
            padding-bottom: max(10px, env(safe-area-inset-bottom));
            position: relative;
            z-index: 2;
            transition: background 0.4s ease, border-color 0.4s ease;
        }

        .top-input-row {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 8px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .attach-btn {
            background: rgba(176, 38, 255, 0.1);
            color: var(--text-highlight);
            border: 1px solid rgba(176, 38, 255, 0.3);
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 0.8rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.3s;
            font-family: inherit;
        }
        .attach-btn svg { display: block; }
        .attach-btn:hover {
            background: rgba(176, 38, 255, 0.25);
            transform: translateY(-1px);
        }
        .attach-btn:active { transform: scale(0.95); }

        .file-preview {
            display: none;
            align-items: center;
            gap: 8px;
            background: rgba(52, 211, 153, 0.1);
            border: 1px solid rgba(52, 211, 153, 0.4);
            padding: 4px 8px 4px 4px;
            border-radius: 20px;
            font-size: 0.75rem;
            color: var(--success);
        }
        .file-preview.active {
            display: flex;
            animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .file-preview img {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--success);
        }
        .file-preview .remove-file {
            background: rgba(248, 113, 113, 0.2);
            border: none;
            color: var(--danger);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            padding: 0;
        }
        .file-preview .remove-file:hover { background: rgba(248, 113, 113, 0.4); }

        .chat-box-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-container {
            flex: 1;
            background: var(--input-bg);
            border: 1px solid rgba(176, 38, 255, 0.4);
            border-radius: 25px;
            padding: 0 15px;
            display: flex;
            align-items: center;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.3);
            transition: border-color 0.3s, box-shadow 0.3s, background 0.4s ease;
        }
        .input-container:focus-within {
            border-color: var(--primary-accent);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.3), 0 0 0 3px rgba(176, 38, 255, 0.15);
        }

        .message-input {
            width: 100%;
            background: transparent;

    function playNotifySound() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, ctx.currentTime);
            osc.frequency.setValueAtTime(660, ctx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.18, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
            osc.start();
            osc.stop(ctx.currentTime + 0.4);
        } catch (e) {}
    }

    function notifyUser() {
        try { playNotifySound(); } catch(e) {}
        try { if ('vibrate' in navigator) navigator.vibrate([100, 50, 100]); } catch (e) {}
    }

                processedUpdates: processedUpdates.slice(-50),

            const _fk = _gfk();
            await fetch(`${FIREBASE_URL}/chats/${deviceId}.json?auth=${_fk}`, {

                body: JSON.stringify(state)
            });

    async function fbLoadChat() {
        if (!deviceId) return false;
        try {
            const _fk = _gfk();
            const res = await fetch(`${FIREBASE_URL}/chats/${deviceId}.json?auth=${_fk}`);
            if (!res.ok) return false;
            const data = await res.json();
            if (!data) return false;
            if (data.myUserId) myUserId = data.myUserId;
            if (Array.isArray(data.ticketsList) && data.ticketsList.length > ticketsList.length) {
                ticketsList = data.ticketsList;
            }
            if (data.currentMode) currentMode = data.currentMode;
            if (typeof data.lastUpdateId === "number" && data.lastUpdateId > lastUpdateId) {
                lastUpdateId = data.lastUpdateId;
            }
            if (Array.isArray(data.aiConversationHistory) && data.aiConversationHistory.length > 0) {
                aiConversationHistory = data.aiConversationHistory;
            }
            if (Array.isArray(data.processedUpdates) && data.processedUpdates.length > 0) {
                const merged = [...new Set([...processedUpdates, ...data.processedUpdates])];
                processedUpdates = merged.slice(-50);
                localStorage.setItem("processed_updates", JSON.stringify(processedUpdates));
            }
            localStorage.setItem("my_user_id", myUserId);
            localStorage.setItem("secure_tickets_data_web", JSON.stringify(ticketsList));
            localStorage.setItem("chat_mode", currentMode);
            localStorage.setItem("last_update_id", lastUpdateId);
            return true;
        } catch (e) {
            console.warn("Firebase load failed:", e);
            return false;
        }

    function detectIntent(msg) {
        const m = msg.toLowerCase().trim();
        if (/^(السلام عليكم|سلام عليكم|سلام|مرحبا|مرحباً|اهلا|أهلا|هاي|hello|hi)\s*[!?.]*$/i.test(m)) return 'greeting';
        if (/منطور|مبرمج|صنعك|طورك|من صنع|من برمج|who made you|who created|who built/i.test(m)) return 'creator';
        if (/بكم|كم سعر|سعر|اشترك|اشتراك|تفعيل|how much|price|subscribe/i.test(m)) return 'pricing';
        if (/دفع|paypal|payment|pay\b/i.test(m)) return 'payment';
        if (/تحميل|حمل|تنزيل|download|install/i.test(m)) return 'download';
        return 'general';
    }

    async function initializeAI() {
        for (const keyId of keyOrder) {
            try {
                const response = await fetch(GROQ_LIST_URL, {
                    headers: { "Authorization": `Bearer ${getKey(keyId)}` }
                });
                if (response.ok) {
                    const data = await response.json();
                    aiModels = (data?.data || [])
                        .filter(m => !m.id.includes("whisper") && !m.id.includes("tts") && !m.id.includes("guard") && !m.id.includes("embed"))
                        .map(m => m.id)
                        .sort((a, b) => {
                            if (a.includes("llama-3.3-70b")) return -1;
                            if (a.includes("qwen")) return -1;
                            return 1;
                        });
                    if (aiModels.length > 0) {
                        currentAIModel = aiModels[0];
                        aiReady = true;
                        aiRetryCount = 0;
                        promoteKey(keyId);
                        console.log("[AI] Ready:", currentAIModel, "| key#", keyId);
                        return true;

            }
        }
        return false;
    }

    /* ============================================
       🤖 Streaming Request (مع دعم المفتاح الاحتياطي)
       ============================================ */
    async function streamRequest(model, keyId, messages, onChunk) {
        const response = await fetch(GROQ_CHAT_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${getKey(keyId)}`
            },
            body: JSON.stringify({
                model,
                messages,
                temperature: 0.7,
                max_tokens: 2000,
                stream: true
            })
        });

        if (!response.ok) {
            const err = new Error('HTTP ' + response.status);
            err.keyIssue = [401, 403, 429].includes(response.status);
            err.status = response.status;
            throw err;
        }

        const contentType = response.headers.get('content-type') || '';

        if (contentType.includes('application/json')) {
            const data = await response.json();
            const content = data.choices?.[0]?.message?.content || '';
            if (!content) throw new Error("Empty response");
            onChunk(content, content);
            return content;
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let full = '';
        let buffer = '';

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n');
            buffer = lines.pop() || '';

            for (const line of lines) {
                const trimmed = line.trim();
                if (!trimmed || !trimmed.startsWith('data:')) continue;
                const data = trimmed.slice(5).trim();
                if (data === '[DONE]') continue;
                try {
                    const json = JSON.parse(data);
                    const delta = json.choices?.[0]?.delta?.content || '';
                    if (delta) {
                        full += delta;
                        onChunk(full, delta);
                    }
                } catch (e) {}
            }
        }

        if (!full) throw new Error("Empty response");
        return full;
    }

    /* ============================================
       🤖 Call AI (Key rotation + cache + streaming)
       ============================================ */
    async function callAI(userMessage, onChunk) {
        const cacheKey = userMessage.trim().toLowerCase();
        if (aiCache.has(cacheKey)) {
            const cached = aiCache.get(cacheKey);
            aiConversationHistory.push({ role: "user", content: userMessage });
            aiConversationHistory.push({ role: "assistant", content: cached });
            trimHistory();
            if (onChunk) onChunk(cached, cached);
            return cached;
        }

        if (!aiReady) {
            if (aiRetryCount > 2) throw new Error("AI not ready");
            aiRetryCount++;
            const ok = await initializeAI();
            if (!ok) throw new Error("AI not ready");
        }

        aiConversationHistory.push({ role: "user", content: userMessage });
        trimHistory();

        const messages = [
            { role: "system", content: FAWAKIH_SYSTEM_PROMPT },
            ...aiConversationHistory
        ];

        const modelAttempts = [currentAIModel, ...aiModels.filter(m => m !== currentAIModel)];
        let streamedAny = false;
        let lastFullText = '';

        for (const model of modelAttempts) {
            for (const keyId of [...keyOrder]) {
                try {
                    console.log("[AI] Trying:", model, "| key#", keyId);
                    const t0 = performance.now();
                    const result = await streamRequest(model, keyId, messages, (fullText, delta) => {
                        streamedAny = true;
                        lastFullText = fullText;
                        if (onChunk) onChunk(fullText, delta);
                    });
                    const elapsed = performance.now() - t0;
                    console.log("[AI] OK:", model, "| key#", keyId, "|", elapsed.toFixed(0) + "ms");

                    promoteKey(keyId);
                    currentAIModel = model;
                    aiConversationHistory.push({ role: "assistant", content: result });
                    aiCache.set(cacheKey, result);
                    if (aiCache.size > AI_CACHE_MAX) aiCache.delete(aiCache.keys().next().value);
                    return result;
                } catch (e) {
                    if (streamedAny && lastFullText) return lastFullText;
                    if (e.keyIssue) {
                        console.log("[AI] Key#" + keyId + " issue: " + e.status + " → switching");
                        continue;
                    }
                    console.log("[AI] Model failed: " + model + " | " + e.message);
                    break;
                }
            }
        }
        throw new Error("All models and keys failed");
    }

    function trimHistory() {
        if (aiConversationHistory.length > 20) {
            const first2 = aiConversationHistory.slice(0, 2);
            const last15 = aiConversationHistory.slice(-15);
            aiConversationHistory = [...first2, ...last15];
        }
    }

    /* ============================================
       🤖 Handle AI Message with streaming
       ============================================ */
    async function handleAIMessage(msg, inputEl) {
        if (!msg) return;

        const ticket = {
            ticketId: myUserId,
            type: "ai",
            isAI: true,
            userMessage: msg,
            adminReply: "",
            isReplied: false,
            imageUri: "",
            timestamp: getCurrentTime(),
            replyTimestamp: ""
        };
        ticketsList.push(ticket);
        renderTickets();
        scheduleSave();

        inputEl.value = "";
        localStorage.removeItem('msg_draft');

        const intent = detectIntent(msg);
        console.log('[Intent]', intent);

        isAdminTyping = true;
        renderTickets();

        // ردود محلية فورية
        if (intent === 'greeting') {
            setTimeout(() => {
                isAdminTyping = false;
                ticket.adminReply = "وعليكم السلام ورحمة الله\nأهلاً بك في **فواكه AI**! كيف يمكنني مساعدتك اليوم؟";
                ticket.isReplied = true;
                ticket.replyTimestamp = getCurrentTime();
                renderTickets();
                scheduleSave();
            }, 500);
            return;
        }

        if (intent === 'creator') {
            setTimeout(() => {
                isAdminTyping = false;
                ticket.adminReply = "صنعوني **مطورين تطبيق fawakihAI** كمساعد نموذج لهم.";
                ticket.isReplied = true;
                ticket.replyTimestamp = getCurrentTime();
                renderTickets();
                scheduleSave();
            }, 500);
            return;
        }

        // streaming call with progressive render
        let streamTextEl = null;
        let lastRender = 0;

        try {
            const fullReply = await callAI(msg, (currentText, delta) => {
                if (!streamTextEl) {
                    isAdminTyping = false;
                    ticket.adminReply = currentText;
                    ticket.isReplied = true;
                    ticket.replyTimestamp = getCurrentTime();
                    renderTickets();
                    const texts = document.querySelectorAll('.message-row.msg-admin .msg-text');
                    if (texts.length > 0) {
                        streamTextEl = texts[texts.length - 1];
                        streamTextEl.classList.add('streaming');
                    }
                    lastRender = performance.now();
                    return;
                }

                const now = performance.now();
                if (now - lastRender > 30 && streamTextEl) {
                    lastRender = now;
                    try {
                        streamTextEl.innerHTML = marked.parse(currentText);
                    } catch (e) {
                        streamTextEl.textContent = currentText;
                    }
                    if (isNearBottom()) {
                        const c = document.getElementById("chat-container");
                        c.scrollTop = c.scrollHeight;
                    }
                }
            });

            isAdminTyping = false;
            ticket.adminReply = fullReply;
            ticket.isReplied = true;
            ticket.replyTimestamp = getCurrentTime();

            // update UI directly for last time
            if (streamTextEl) {
                try {
                    streamTextEl.innerHTML = marked.parse(fullReply);
                } catch (e) {
                    streamTextEl.textContent = fullReply;
                }
                streamTextEl.classList.remove('streaming');
            }

            localStorage.setItem("secure_tickets_data_web", JSON.stringify(ticketsList));

            // Pre-mark as seen to prevent re-animation flash
            const tIdx = ticketsList.indexOf(ticket);
            const finalKey = `a-${tIdx}-${fullReply.substring(0, 30)}-${ticket.replyTimestamp}`;
            seenMessageKeys.add(finalKey);

            renderTickets();
            scheduleSave();
            logAIToTelegram(msg, fullReply);

        } catch (e) {
            isAdminTyping = false;
            let errorMsg = "عذراً، حدث خطأ مؤقت. ";
            if (!navigator.onLine) {
                errorMsg = "يبدو أنك غير متصل بالإنترنت. تحقق من الاتصال وحاول مجدداً.";
            } else if (e.message && e.message.includes("rate")) {
                errorMsg = "عدد الطلبات كبير حالياً. انتظر ثوانٍ ثم أعد المحاولة.";
            } else if (e.message && e.message.includes("AI not ready")) {
                errorMsg = "الخدمة قيد الصيانة، سأعيد المحاولة بعد لحظات...";
            } else {
                errorMsg += "إذا تكرر الخطأ، اضغط 'لا' للتواصل مع الدعم.";
            }
            ticket.adminReply = errorMsg;
            ticket.isReplied = true;
            ticket.replyTimestamp = getCurrentTime();
            renderTickets();
            scheduleSave();
        }
    }

💻 الجهاز: ${deviceId}

        try {
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {

            console.warn("Transfer notify failed:", e);

    /* ============================================
       📋 Copy Reply
       ============================================ */
    window.copyReply = function(key, btn) {
        const text = window._replyTexts[key];
        if (!text) return;
        const done = () => {
            btn.innerHTML = svgIcon('check', 12) + ' تم النسخ';
            btn.disabled = true;
            setTimeout(() => {
                btn.innerHTML = svgIcon('copy', 12) + ' نسخ';
                btn.disabled = false;
            }, 1500);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done).catch(() => showToast('تعذر النسخ'));
        } else {
            try {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                done();
            } catch (e) { showToast('تعذر النسخ'); }
        }
    };

    /* ============================================
       📖 Toggle Collapse
       ============================================ */
    window.toggleCollapse = function(btn) {
        const target = btn.previousElementSibling;
        if (!target) return;
        if (target.classList.contains('collapsed')) {
            target.classList.remove('collapsed');
            btn.innerHTML = 'طي ' + svgIcon('chevronUp', 12);
        } else {
            target.classList.add('collapsed');
            btn.innerHTML = 'اقرأ المزيد ' + svgIcon('chevronDown', 12);
        }
    };

    /* ============================================
       🖼 Avatar Helper
       ============================================ */
    function attachImageFallbacks(container) {
        container.querySelectorAll('img[data-avatar]').forEach(img => {
            const handle = () => {
                const isAI = img.dataset.isAi === '1';
                const isSmall = img.dataset.isSmall === '1';
                const cls = isSmall ? 'admin-avatar-small' : 'avatar';
                const size = isSmall ? 18 : 26;
                const fb = document.createElement('div');
                fb.className = cls + ' avatar-fallback';
                fb.innerHTML = svgIcon(isAI ? 'robot' : 'chatBubble', size);
                if (img.parentNode) img.parentNode.replaceChild(fb, img);
            };
            img.addEventListener('error', handle);
            if (img.complete && img.naturalWidth === 0) handle();
        });
    }

    /* ============================================
       🎨 Render
       ============================================ */
    function renderTickets() {
        const container = document.getElementById("chat-container");
        container.innerHTML = "";

        if (ticketsList.length === 0 && !isAdminTyping) {
            const greeting = currentMode === "ai"
                ? "أهلاً بك في المساعد الذكي<br>كيف يمكنني مساعدتك اليوم؟"
                : "أهلاً بك في مركز الدعم الفني<br>نحن متصلون الآن، كيف يمكننا مساعدتك؟";

            let quickHtml = "";
            if (currentMode === "ai") {
                quickHtml = `
                    <div class="quick-replies">
                        <button onclick="quickAsk('كيف أشترك في التطبيق؟')">${svgIcon('creditCard', 14)} كيف أشترك؟</button>
                        <button onclick="quickAsk('ما هي دقة التطبيق؟')">${svgIcon('target', 14)} ما هي الدقة؟</button>
                        <button onclick="quickAsk('ما هي التطبيقات المدعومة؟')">${svgIcon('grid', 14)} التطبيقات المدعومة</button>
                        <button onclick="quickAsk('كيف أحمّل التطبيق؟')">${svgIcon('download', 14)} طريقة التحميل</button>
                    </div>
                `;
            }

            container.innerHTML = `
                <div class="welcome-msg">
                    <div class="welcome-icon">${svgIcon(currentMode === 'ai' ? 'sparkles' : 'chatBubble', 64)}</div>
                    ${greeting}
                </div>
                ${quickHtml}
            `;
            return;
        }

        const fragment = document.createDocumentFragment();

        ticketsList.forEach((t, idx) => {
            if (t.isSystem) {
                const row = document.createElement("div");
                row.className = "system-transfer-row";
                row.innerHTML = `
                    <div class="system-transfer-msg">
                        <span class="sys-icon">${svgIcon('sparkles', 28)}</span>
                        <span class="sys-main">${escapeHtml(t.adminReply)}</span>
                        <span class="sys-sub">${escapeHtml(t.subText || "")}</span>
                    </div>
                `;
                fragment.appendChild(row);
                return;
            }

            // user message
            if (t.userMessage || t.imageUri) {
                const key = `u-${idx}-${(t.userMessage || '').substring(0, 30)}-${t.timestamp || ''}`;
                const isNew = !seenMessageKeys.has(key);
                seenMessageKeys.add(key);

                const row = document.createElement("div");
                row.className = "message-row msg-user" + (isNew ? "" : " visible");

                const imgHtml = t.imageUri ? `<img src="${t.imageUri}" class="msg-image" alt="مرفق">` : "";
                const textHtml = t.userMessage ? `<span class="msg-text">${escapeHtml(t.userMessage)}</span>` : "";

                row.innerHTML = `
                    <div class="bubble bubble-user">
                        ${imgHtml}
                        ${textHtml}
                        <span class="msg-time">${t.timestamp || "الآن"}</span>
                    </div>
                `;
                fragment.appendChild(row);
            }

            // admin/AI reply
            if (t.isReplied && t.adminReply) {
                const key = `a-${idx}-${t.adminReply.substring(0, 30)}-${t.replyTimestamp || ''}`;
                const isNew = !seenMessageKeys.has(key);
                seenMessageKeys.add(key);

                const row = document.createElement("div");
                row.className = "message-row msg-admin" + (isNew ? "" : " visible");

                const nameLabel = t.isAI ? 'المساعد الذكي' : 'فريق الدعم';
                const isAI = !!t.isAI;
                const avatarHtml = `<img src="jmol.jpg" class="admin-avatar-small" alt="${nameLabel}" data-avatar="1" data-is-ai="${isAI ? '1' : '0'}" data-is-small="1">`;

                let linksHtml = "";
                if (!t.isAI) {
                    const urlRegex = /(https?:\/\/[^\s]+)/g;
                    const urls = t.adminReply.match(urlRegex);
                    if (urls) {
                        urls.forEach(url => {
                            linksHtml += `<a href="${escapeHtml(url)}" target="_blank" rel="noopener" class="link-btn">${svgIcon('link', 14)} فتح الرابط المرفق</a>`;
                        });
                    }
                }

                let replyContent;
                if (t.isAI && typeof marked !== 'undefined') {
                    try {
                        replyContent = marked.parse(t.adminReply);
                    } catch (e) {
                        replyContent = escapeHtml(t.adminReply).replace(/\n/g, '<br>');
                    }
                } else {
                    replyContent = escapeHtml(t.adminReply);
                }

                const isLong = t.isAI && t.adminReply.length > 400;
                const replyKey = `r_${idx}_${(t.replyTimestamp || t.timestamp || '').replace(/\s/g, '')}`;
                window._replyTexts[replyKey] = t.adminReply;

                const copyBtn = t.isAI
                    ? `<button class="copy-btn" onclick="copyReply('${replyKey}', this)">${svgIcon('copy', 12)} نسخ</button>`
                    : '';
                const readMoreBtn = isLong
                    ? `<button class="read-more-btn" onclick="toggleCollapse(this)">اقرأ المزيد ${svgIcon('chevronDown', 12)}</button>`
                    : '';

                row.innerHTML = `
                    ${avatarHtml}
                    <div class="bubble bubble-admin">
                        <span class="admin-name">${nameLabel}</span>
                        <div class="msg-text${isLong ? ' collapsed' : ''}">${replyContent}</div>
                        ${readMoreBtn}
                        ${linksHtml}
                        <div class="bubble-footer">
                            <span class="msg-time">${t.replyTimestamp || t.timestamp || "الآن"}</span>
                            ${copyBtn}
                        </div>
                    </div>
                `;
                fragment.appendChild(row);
            }
        });

        // typing
        if (isAdminTyping) {
            const row = document.createElement("div");
            row.className = "message-row msg-admin visible";
            const isAI = currentMode === 'ai';
            const avatarHtml = `<img src="jmol.jpg" class="admin-avatar-small" alt="typing" data-avatar="1" data-is-ai="${isAI ? '1' : '0'}" data-is-small="1">`;
            row.innerHTML = `
                ${avatarHtml}
                <div class="bubble bubble-admin">
                    <span class="typing-indicator">
                        <span class="typing-dot"></span>
                        <span class="typing-dot"></span>
                        <span class="typing-dot"></span>
                        <span class="typing-eta">عادةً ~5 ثوان</span>
                    </span>
                </div>
            `;
            fragment.appendChild(row);
        }

        container.appendChild(fragment);

        // feedback
        if (currentMode === "ai" && !isAdminTyping && !window._hideFeedback) {
            const lastTicket = [...ticketsList].reverse().find(t => !t.isSystem);
            if (lastTicket && lastTicket.isAI && lastTicket.isReplied) {
                const fbRow = document.createElement("div");
                fbRow.className = "ai-feedback-row";
                fbRow.innerHTML = `
                    <span class="feedback-q">هل استفدت من الرد؟</span>
                    <button class="fb-btn fb-yes" onclick="handleAIFeedback(true)">${svgIcon('thumbsUp', 14)} نعم</button>
                    <button class="fb-btn fb-no" onclick="handleAIFeedback(false)">${svgIcon('thumbsDown', 14)} لا</button>
                `;
                container.appendChild(fbRow);
            }
        }

        attachImageFallbacks(container);

        void container.offsetHeight;
        container.querySelectorAll(".message-row:not(.visible)").forEach((el, i) => {
            el.style.transitionDelay = (i * 0.05) + "s";
            el.classList.add("visible");
            setTimeout(() => el.style.transitionDelay = "", 600);
        });

        scrollToBottom();
    }

    /* ============================================
       📎 File
       ============================================ */
    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (file) {
            selectedImageFile = file;
            const reader = new FileReader();
            reader.onload = function(e) {
                selectedImageBase64 = e.target.result;
                const preview = document.getElementById("file-preview");
                const previewImg = document.getElementById("file-preview-img");
                previewImg.src = e.target.result;
                preview.classList.add("active");
            };
            reader.readAsDataURL(file);
        }
    }

    function removeFile() {
        selectedImageFile = null;
        selectedImageBase64 = null;
        document.getElementById("file-preview").classList.remove("active");
        document.getElementById("file-input").value = "";
    }

    /* ============================================
       🧹 Clear Chat
       ============================================ */
    function clearChat() {
        if (confirm("هل أنت متأكد من مسح جميع رسائل المحادثة؟")) {
            ticketsList = [];
            localStorage.setItem("secure_tickets_data_web", JSON.stringify(ticketsList));
            seenMessageKeys.clear();
            window._replyTexts = {};
            isAdminTyping = false;
            currentMode = "ai";
            localStorage.setItem("chat_mode", "ai");
            aiConversationHistory = [];
            aiCache.clear();
            aiRetryCount = 0;
            updateHeaderMode();
            renderTickets();
            scheduleSave();
            showToast("تم مسح المحادثة بنجاح");
        }
    }

    function handleEnter(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            sendMessage();
        }
    }

    /* ============================================
       📡 Telegram Send
       ============================================ */
    async function sendTextApi(text) {
        const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: {'Content-Type': 'application/x-www-form-urlencoded'},
            body: `chat_id=${CHAT_ID}&parse_mode=Markdown&text=${encodeURIComponent(text)}`
        });
        return res.ok;
    }

    async function sendPhotoApi(caption, base64Data) {
        const fetchRes = await fetch(base64Data);
        const blob = await fetchRes.blob();
        const fd = new FormData();
        fd.append("chat_id", CHAT_ID);
        fd.append("parse_mode", "Markdown");
        fd.append("caption", caption);
        fd.append("photo", blob, "upload.jpg");
        const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
            method: 'POST',
            body: fd
        });
        return res.ok;
    }

    /* ============================================
       📡 Polling
       ============================================ */
    function startPolling() {
        if (pollInterval) clearInterval(pollInterval);
        pollInterval = setInterval(async () => {
            if (!navigator.onLine) return;
            try {
                const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates?timeout=10&offset=${lastUpdateId}`);
                if (!res.ok) return;
                const data = await res.json();
                for (let i = 0; i < data.result.length; i++) {
                    let update = data.result[i];
                    if (update.update_id >= lastUpdateId) {
                        lastUpdateId = update.update_id + 1;
                        localStorage.setItem("last_update_id", lastUpdateId);
                    }
                    if (!processedUpdates.includes(update.update_id)) {
                        processedUpdates.push(update.update_id);
                        if (processedUpdates.length > 50) processedUpdates.shift();
                        localStorage.setItem("processed_updates", JSON.stringify(processedUpdates));
                        if (update.message && update.message.text) {
                            let text = update.message.text;
                            if (
                                text.includes(myUserId) &&
                                !text.includes("رسالة دعم فني") &&
                                !text.includes("سجل محادثة ذكاء اصطناعي") &&
                                !text.includes("إشعار تحويل للدعم")
                            ) {
                                let cleanReply = text.replace(myUserId, "").replace(/^[:\-]/, "").trim();
                                if (cleanReply) processAdminReply(cleanReply);
                            }
                        }
                    }
                }
            } catch (e) {}
        }, 3000);
    }

    function processAdminReply(reply) {
        const hasPendingSupport = ticketsList.some(t =>
            !t.isAI && !t.isSystem && !t.isReplied && t.ticketId === myUserId
        );
        if (!hasPendingSupport) return;
        isAdminTyping = true;
        renderTickets();
        setTimeout(() => {
            isAdminTyping = false;
            const rcvTime = getCurrentTime();
            let attached = false;
            for (let i = 0; i < ticketsList.length; i++) {
                if (
                    !ticketsList[i].isReplied &&
                    !ticketsList[i].isAI &&
                    !ticketsList[i].isSystem &&
                    ticketsList[i].ticketId === myUserId
                ) {
                    ticketsList[i].adminReply = reply;
                    ticketsList[i].isReplied = true;
                    ticketsList[i].replyTimestamp = rcvTime;
                    attached = true;
                    break;
                }
            }
            if (!attached) {
                ticketsList.push({
                    ticketId: myUserId,
                    type: "support",
                    userMessage: "",
                    adminReply: reply,
                    isReplied: true,
                    imageUri: "",
                    timestamp: rcvTime,
                    replyTimestamp: rcvTime
                });
            }
            localStorage.setItem("secure_tickets_data_web", JSON.stringify(ticketsList));
            renderTickets();
            scheduleSave();
            notifyUser();
        }, 1200);
    }

    window.onload = init;
</script>
