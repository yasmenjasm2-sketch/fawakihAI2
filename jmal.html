<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <title>مركز الدعم الفني - FawakihAI</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-grad-1: #05050A;
            --bg-grad-2: #080812;
            --bg-grad-3: #0A0A15;
            --header-bg: #11081F;
            --primary-accent: #B026FF;
            --user-bubble-1: #B026FF;
            --user-bubble-2: #8015C2;
            --admin-bubble-bg: #11081F;
            --input-bg: #0A0512;
            --text-main: #FFFFFF;
            --text-muted: #9CA3AF;
            --text-highlight: #D8B4FE;
            --success: #34D399;
            --danger: #F87171;
            --warning: #FBBF24;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100dvh;
            width: 100%;
            overflow: hidden;
            background: var(--bg-grad-1);
            color: var(--text-main);
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #app-container {
            width: 100%;
            max-width: 600px;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, var(--bg-grad-1), var(--bg-grad-2), var(--bg-grad-3));
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        #app-container::before,
        #app-container::after {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(176, 38, 255, 0.15) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        #app-container::before {
            top: -180px;
            right: -120px;
            animation: floatOrb 16s ease-in-out infinite;
        }
        #app-container::after {
            bottom: -180px;
            left: -120px;
            animation: floatOrb 20s ease-in-out infinite reverse;
        }
        @keyframes floatOrb {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(35px, 45px) scale(1.25); }
        }

        /* --- Header --- */
        .header {
            background: var(--header-bg);
            padding: 15px 20px;
            border-radius: 0 0 25px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 5px 20px rgba(176, 38, 255, 0.15);
            z-index: 10;
            position: relative;
            border-bottom: 2px solid rgba(176, 38, 255, 0.3);
            flex-shrink: 0;
        }

        .header-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar-wrapper {
            position: relative;
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .avatar-wrapper::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent, var(--primary-accent), transparent, var(--primary-accent), transparent);
            animation: rotateRing 4s linear infinite;
            z-index: 0;
            filter: blur(1px);
        }
        @keyframes rotateRing {
            to { transform: rotate(360deg); }
        }

        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid var(--header-bg);
            object-fit: cover;
            background-color: var(--bg-grad-1);
            position: relative;
            z-index: 1;
            animation: avatarPulse 2.4s ease-in-out infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
        }
        @keyframes avatarPulse {
            0%, 100% { box-shadow: 0 0 10px rgba(176, 38, 255, 0.4); }
            50% { box-shadow: 0 0 20px rgba(176, 38, 255, 0.9), 0 0 32px rgba(176, 38, 255, 0.5); }
        }

        .header-text {
            display: flex;
            flex-direction: column;
        }

        .header-title {
            font-size: 1.1rem;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            color: #FFFFFF;
        }

        .header-status {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--success);
            text-shadow: 0 0 8px rgba(52, 211, 153, 0.4);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 8px var(--success);
            animation: statusPulse 1.5s ease-in-out infinite;
        }
        @keyframes statusPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.35); }
        }

        .clear-btn {
            background: rgba(176, 38, 255, 0.15);
            color: var(--text-highlight);
            border: 1px solid rgba(176, 38, 255, 0.3);
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .clear-btn:hover {
            background: rgba(176, 38, 255, 0.3);
            transform: scale(1.05);
        }
        .clear-btn:active {
            transform: scale(0.94);
        }

        /* --- Chat Area --- */
        .chat-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 15px 15px;
            display: flex;
            flex-direction: column;
            scroll-behavior: smooth;
            position: relative;
            z-index: 1;
        }

        .chat-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .chat-scroll::-webkit-scrollbar-thumb {
            background: rgba(176, 38, 255, 0.3);
            border-radius: 5px;
        }

        .message-row {
            display: flex;
            margin-bottom: 20px;
            width: 100%;
            opacity: 0;
            transform: translateY(15px) scale(0.96);
            transition: opacity 0.45s cubic-bezier(0.34, 1.56, 0.64, 1),
                        transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .message-row.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .msg-user {
            justify-content: flex-start;
        }

        .msg-admin {
            justify-content: flex-end;
        }

        .bubble {
            max-width: 85%;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            word-wrap: break-word;
            position: relative;
        }

        .bubble-user {
            background: linear-gradient(135deg, var(--user-bubble-1), var(--user-bubble-2));
            border-radius: 20px 20px 20px 0;
            margin-left: 20px;
            box-shadow: 0 4px 15px rgba(176, 38, 255, 0.2);
        }

        .bubble-admin {
            background: var(--admin-bubble-bg);
            border: 1px solid rgba(176, 38, 255, 0.2);
            border-radius: 20px 20px 0 20px;
            margin-right: 10px;
            animation: adminGlow 3s ease-in-out infinite;
        }
        @keyframes adminGlow {
            0%, 100% { border-color: rgba(176, 38, 255, 0.2); }
            50% { border-color: rgba(176, 38, 255, 0.5); }
        }

        .admin-avatar-small {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 1px solid var(--primary-accent);
            align-self: flex-end;
            object-fit: cover;
            margin-left: 8px;
            box-shadow: 0 0 8px rgba(176, 38, 255, 0.4);
        }

        .ai-avatar {
            background: linear-gradient(135deg, var(--primary-accent), #7A12C1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            color: white;
        }

        .msg-text {
            font-size: 0.95rem;
            line-height: 1.5;
        }

        /* تنسيق Markdown داخل ردود الذكاء الاصطناعي */
        .bubble-admin .msg-text p { margin-bottom: 8px; }
        .bubble-admin .msg-text p:last-child { margin-bottom: 0; }
        .bubble-admin .msg-text ul, 
        .bubble-admin .msg-text ol { margin: 8px 0; padding-right: 20px; }
        .bubble-admin .msg-text li { margin-bottom: 4px; }
        .bubble-admin .msg-text strong { color: var(--text-highlight); }
        .bubble-admin .msg-text code {
            background: rgba(0,0,0,0.4);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.85rem;
            color: var(--text-highlight);
        }

        .msg-time {
            font-size: 0.65rem;
            align-self: flex-end;
            margin-top: 5px;
            opacity: 0.8;
        }

        .bubble-user .msg-time { color: #F3E8FF; }
        .bubble-admin .msg-time { color: var(--text-muted); align-self: flex-start; }

        .admin-name {
            font-size: 0.8rem;
            color: var(--primary-accent);
            font-weight: 700;
            margin-bottom: 4px;
        }

        .msg-image {
            max-width: 100%;
            border-radius: 12px;
            margin-bottom: 8px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .link-btn {
            background: rgba(176, 38, 255, 0.2);
            border: 1px solid var(--primary-accent);
            color: white;
            padding: 8px 12px;
            border-radius: 15px;
            text-decoration: none;
            font-size: 0.85rem;
            text-align: center;
            margin-top: 8px;
            display: inline-block;
            transition: all 0.25s;
        }
        .link-btn:hover {
            background: rgba(176, 38, 255, 0.45);
            transform: translateY(-2px);
        }

        /* --- Typing Indicator --- */
        .typing-indicator {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 4px;
        }
        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary-accent);
            box-shadow: 0 0 8px rgba(176, 38, 255, 0.7);
            animation: typingBounce 1.4s infinite ease-in-out;
        }
        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-7px); opacity: 1; }
        }

        /* --- Welcome Empty State --- */
        .welcome-msg {
            text-align: center;
            color: var(--text-muted);
            margin-top: 50px;
            line-height: 1.9;
            padding: 20px;
            animation: floatText 3.5s ease-in-out infinite;
        }
        .welcome-icon {
            font-size: 3.2rem;
            margin-bottom: 15px;
            display: block;
            animation: iconFloat 3s ease-in-out infinite;
        }
        @keyframes floatText {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        @keyframes iconFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(6deg); }
        }

        /* --- أزرار التقييم الشفافة (هل استفدت؟) --- */
        .ai-feedback-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: rgba(176, 38, 255, 0.05);
            border: 1px dashed rgba(176, 38, 255, 0.35);
            border-radius: 18px;
            margin: 0 20px 20px auto;
            max-width: 88%;
            justify-content: flex-end;
            animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            direction: rtl;
        }

        .feedback-q {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .fb-btn {
            background: rgba(176, 38, 255, 0.12);
            border: 1px solid rgba(176, 38, 255, 0.4);
            color: white;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-family: inherit;
            font-weight: 700;
        }
        .fb-btn:hover { transform: scale(1.08); }
        .fb-btn:active { transform: scale(0.9); }
        .fb-yes:hover {
            background: rgba(52, 211, 153, 0.3);
            border-color: var(--success);
            color: var(--success);
        }
        .fb-no:hover {
            background: rgba(248, 113, 113, 0.3);
            border-color: var(--danger);
            color: var(--danger);
        }
        @keyframes popIn {
            from { transform: scale(0.6); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* --- رسالة نظام التحويل للدعم --- */
        .system-transfer-row {
            display: flex;
            justify-content: center;
            margin: 15px 0 20px 0;
            width: 100%;
            animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .system-transfer-msg {
            text-align: center;
            padding: 16px 22px;
            background: linear-gradient(135deg, rgba(52, 211, 153, 0.08), rgba(176, 38, 255, 0.08));
            border: 1px solid rgba(52, 211, 153, 0.45);
            border-radius: 22px;
            max-width: 90%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 4px 20px rgba(52, 211, 153, 0.15);
        }
        .sys-icon {
            font-size: 1.5rem;
            margin-bottom: 4px;
        }
        .sys-main {
            color: var(--success);
            font-weight: 700;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .sys-sub {
            color: var(--text-highlight);
            font-weight: 600;
            font-size: 0.9rem;
        }

        /* --- Input Area --- */
        .input-area {
            background: var(--header-bg);
            padding: 10px 15px;
            border-radius: 30px 30px 0 0;
            display: flex;
            flex-direction: column;
            box-shadow: 0 -5px 25px rgba(0,0,0,0.5);
            border-top: 1px solid rgba(176, 38, 255, 0.15);
            flex-shrink: 0;
            padding-bottom: max(10px, env(safe-area-inset-bottom));
            position: relative;
            z-index: 2;
        }

        .top-input-row {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 8px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .attach-btn {
            background: rgba(176, 38, 255, 0.1);
            color: var(--text-highlight);
            border: 1px solid rgba(176, 38, 255, 0.3);
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.3s;
        }
        .attach-btn:hover {
            background: rgba(176, 38, 255, 0.25);
            transform: translateY(-1px);
        }
        .attach-btn:active { transform: scale(0.95); }

        .file-preview {
            display: none;
            align-items: center;
            gap: 8px;
            background: rgba(52, 211, 153, 0.1);
            border: 1px solid rgba(52, 211, 153, 0.4);
            padding: 4px 8px 4px 4px;
            border-radius: 20px;
            font-size: 0.75rem;
            color: var(--success);
        }
        .file-preview.active {
            display: flex;
            animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .file-preview img {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--success);
        }
        .file-preview .remove-file {
            background: rgba(248, 113, 113, 0.2);
            border: none;
            color: var(--danger);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .file-preview .remove-file:hover { background: rgba(248, 113, 113, 0.4); }

        .chat-box-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-container {
            flex: 1;
            background: var(--input-bg);
            border: 1px solid rgba(176, 38, 255, 0.4);
            border-radius: 25px;
            padding: 0 15px;
            display: flex;
            align-items: center;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .input-container:focus-within {
            border-color: var(--primary-accent);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5), 0 0 0 3px rgba(176, 38, 255, 0.15);
        }

        .message-input {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            font-size: 0.95rem;
            padding: 12px 0;
            resize: none;
            outline: none;
            height: 45px;
            font-family: inherit;
        }
        .message-input::placeholder { color: var(--text-muted); }

        .send-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-accent), #7A12C1);
            border: none;
            color: white;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(176, 38, 255, 0.4);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s;
            flex-shrink: 0;
        }
        .send-btn svg {
            width: 20px;
            height: 20px;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .send-btn:hover {
            transform: scale(1.06);
            box-shadow: 0 6px 22px rgba(176, 38, 255, 0.65);
        }
        .send-btn:hover svg { transform: rotate(45deg) translateX(2px); }
        .send-btn:active { transform: scale(0.9); }
        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .toast {
            position: absolute;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(17, 8, 31, 0.95);
            border: 1px solid var(--primary-accent);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.85rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 100;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            white-space: nowrap;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        #file-input { display: none; }
    </style>
</head>
<body>

<div id="app-container">
    <div class="header">
        <div class="header-info">
            <div class="avatar-wrapper">
                <div class="avatar" id="header-avatar">🤖</div>
            </div>
            <div class="header-text">
                <span class="header-title" id="header-title">المساعد الذكي</span>
                <span class="header-status" id="header-status">
                    <span class="status-dot"></span>
                    متصل الآن
                </span>
            </div>
        </div>
        <button class="clear-btn" onclick="clearChat()">مسح السجل</button>
    </div>

    <div class="chat-scroll" id="chat-container"></div>

    <div class="input-area">
        <div class="top-input-row">
            <div class="file-preview" id="file-preview">
                <img id="file-preview-img" src="" alt="معاينة">
                <span>صورة جاهزة للإرسال</span>
                <button class="remove-file" onclick="removeFile()" title="إزالة">✕</button>
            </div>
            <button class="attach-btn" onclick="document.getElementById('file-input').click()">📎 إرفاق صورة</button>
            <input type="file" id="file-input" accept="image/*" onchange="handleFileSelect(event)">
        </div>
        <div class="chat-box-row">
            <div class="input-container">
                <input type="text" class="message-input" id="message-input" placeholder="اكتب استفسارك هنا..." onkeypress="handleEnter(event)" onfocus="scrollToBottom()">
            </div>
            <button class="send-btn" onclick="sendMessage()" title="إرسال">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>

    <div class="toast" id="toast"></div>
</div>

<script>
    /* ============================================
       إعدادات Markdown للذكاء الاصطناعي
       ============================================ */
    if (typeof marked !== 'undefined') {
        marked.setOptions({ breaks: true, gfm: true });
    }

    /* ============================================
       إعدادات الكيبورد للموبايل
       ============================================ */
    const appContainer = document.getElementById('app-container');
    const visualViewport = window.visualViewport;

    if (visualViewport) {
        visualViewport.addEventListener('resize', () => {
            appContainer.style.height = `${visualViewport.height}px`;
            scrollToBottom();
        });
    }

    /* ============================================
       🔑 إعدادات Telegram (كما هي تماماً)
       ============================================ */
    const ENC_BOT_TOKEN = "ODYyMDE5ODA0NDpBQUVJbzhCc3JZanYtQy1Rc1lUVDFEbHp2WktkOU1fRDI4RQ==";
    const ENC_CHAT_ID = "ODY4MTMwNDE2Mw==";

    const BOT_TOKEN = atob(ENC_BOT_TOKEN);
    const CHAT_ID = atob(ENC_CHAT_ID);

    /* ============================================
       🧠 إعدادات الذكاء الاصطناعي (Groq) — منقول بالكامل من الملف الأول
       ============================================ */

    async function initializeAI() {
        try {
            const response = await fetch(GROQ_LIST_URL, {
                headers: { "Authorization": `Bearer ${GROQ_KEY}` }
            });

            if (response.ok) {
                const data = await response.json();
                aiModels = (data?.data || [])
                    .filter(m => !m.id.includes("whisper") && !m.id.includes("tts") && !m.id.includes("guard"))
                    .map(m => m.id)
                    .sort((a, b) => {
                        if (a.includes("llama-3.3-70b")) return -1;
                        if (a.includes("qwen")) return -1;
                        return 1;
                    });

                if (aiModels.length > 0) {
                    currentAIModel = aiModels[0];
                    aiReady = true;
                    console.log("✅ AI Ready with:", currentAIModel);
                    return true;
                }
            }
        } catch (e) {
            console.error("AI init failed:", e);
        }
        return false;
    }

    /* ============================================
       🤖 استدعاء الذكاء الاصطناعي (نفس منطق الملف الأول)
       ============================================ */
    async function callAI(userMessage) {
        if (!aiReady) {
            const ok = await initializeAI();
            if (!ok) throw new Error("AI not ready");
        }

        aiConversationHistory.push({ role: "user", content: userMessage });

        const messages = [
            { role: "system", content: FAWAKIH_SYSTEM_PROMPT },
            ...aiConversationHistory
        ];

        const attempts = [currentAIModel, ...aiModels.filter(m => m !== currentAIModel)];

        for (let model of attempts) {
            try {
                console.log(`جارٍ الطلب من: ${model}`);
                const response = await fetch(GROQ_CHAT_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${GROQ_KEY}`
                    },
                    body: JSON.stringify({
                        model: model,
                        messages: messages,
                        temperature: 0.7,
                        max_tokens: 2000
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    currentAIModel = model;
                    const reply = data.choices[0].message.content;
                    aiConversationHistory.push({ role: "assistant", content: reply });
                    return reply;
                }
            } catch (err) {
                console.warn(`فشل النموذج ${model}:`, err.message);
            }
        }
        throw new Error("فشلت جميع محاولات النماذج");
    }

    function renderTickets() {
        const container = document.getElementById("chat-container");
        container.innerHTML = "";

        /* شاشة الترحيب */
        if (ticketsList.length === 0 && !isAdminTyping) {
            container.innerHTML = `

        }

        ticketsList.forEach((t, idx) => {
            /* رسالة نظام التحويل */
            if (t.isSystem) {
                const row = document.createElement("div");
                row.className = "system-transfer-row";
                row.innerHTML = `
                    <div class="system-transfer-msg">
                        <span class="sys-icon">✨</span>
                        <span class="sys-main">${escapeHtml(t.adminReply)}</span>
                        <span class="sys-sub">${escapeHtml(t.subText || "")}</span>
                    </div>
                `;
                fragment.appendChild(row);
                return;
            }

            /* رسالة المستخدم */
            if (t.userMessage || t.imageUri) {
                const key = `u-${idx}-${(t.userMessage || '').substring(0, 30)}-${t.timestamp || ''}`;
                const isNew = !seenMessageKeys.has(key);
                seenMessageKeys.add(key);

                const row = document.createElement("div");
                row.className = "message-row msg-user" + (isNew ? "" : " visible");

                const imgHtml = t.imageUri ? `<img src="${t.imageUri}" class="msg-image" alt="مرفق">` : "";
                const textHtml = t.userMessage ? `<span class="msg-text">${escapeHtml(t.userMessage)}</span>` : "";

                row.innerHTML = `
                    <div class="bubble bubble-user">
                        ${imgHtml}
                        ${textHtml}
                        <span class="msg-time">${t.timestamp || "الآن"}</span>
                    </div>
                `;
                fragment.appendChild(row);
            }

            /* رد المساعد / الدعم */
            if (t.isReplied && t.adminReply) {
                const key = `a-${idx}-${t.adminReply.substring(0, 30)}-${t.replyTimestamp || ''}`;
                const isNew = !seenMessageKeys.has(key);
                seenMessageKeys.add(key);

                const row = document.createElement("div");
                row.className = "message-row msg-admin" + (isNew ? "" : " visible");

                /* اسم وأفاتار حسب النوع */
                const nameLabel = t.isAI ? 'المساعد الذكي' : 'فريق الدعم';
                const avatarHtml = t.isAI
                    ? `<div class="admin-avatar-small ai-avatar">🤖</div>`
                    : `<img src="jmol.jpg" class="admin-avatar-small" alt="Admin" onerror="this.style.display='none'">`;

                /* روابط إن وُجدت في الرد (للدعم فقط) */
                let linksHtml = "";
                if (!t.isAI) {
                    const urlRegex = /(https?:\/\/[^\s]+)/g;
                    const urls = t.adminReply.match(urlRegex);
                    if (urls) {
                        urls.forEach(url => {
                            linksHtml += `<a href="${escapeHtml(url)}" target="_blank" rel="noopener" class="link-btn">🔗 فتح الرابط المرفق</a>`;
                        });
                    }
                }

                /* محتوى الرد: Markdown للذكاء الاصطناعي، نص عادي للدعم */
                let replyContent;
                if (t.isAI && typeof marked !== 'undefined') {
                    try {
                        replyContent = marked.parse(t.adminReply);
                    } catch(e) {
                        replyContent = escapeHtml(t.adminReply).replace(/\n/g, '<br>');
                    }
                } else {
                    replyContent = escapeHtml(t.adminReply);
                }

                row.innerHTML = `
                    ${avatarHtml}
                    <div class="bubble bubble-admin">
                        <span class="admin-name">${nameLabel}</span>
                        <div class="msg-text">${replyContent}</div>
                        ${linksHtml}
                        <span class="msg-time">${t.replyTimestamp || t.timestamp || "الآن"}</span>
                    </div>
                `;
                fragment.appendChild(row);
            }
        });

        /* مؤشر الكتابة */
        if (isAdminTyping) {
            const row = document.createElement("div");
            row.className = "message-row msg-admin visible";
            const avatarHtml = currentMode === "ai"
                ? `<div class="admin-avatar-small ai-avatar">🤖</div>`
                : `<img src="jmol.jpg" class="admin-avatar-small" alt="Admin" onerror="this.style.display='none'">`;
            row.innerHTML = `
                ${avatarHtml}
                <div class="bubble bubble-admin">
                    <span class="typing-indicator">
                        <span class="typing-dot"></span>
                        <span class="typing-dot"></span>
                        <span class="typing-dot"></span>
                    </span>
                </div>
            `;
            fragment.appendChild(row);
        }

        container.appendChild(fragment);

        /* إظهار أزرار التقييم "هل استفدت؟" تحت آخر رد AI فقط */
        if (currentMode === "ai" && !isAdminTyping && !window._hideFeedback) {
            const lastTicket = [...ticketsList].reverse().find(t => !t.isSystem);
            if (lastTicket && lastTicket.isAI && lastTicket.isReplied) {
                const fbRow = document.createElement("div");
                fbRow.className = "ai-feedback-row";
                fbRow.innerHTML = `
                    <span class="feedback-q">هل استفدت من الرد؟</span>
                    <button class="fb-btn fb-yes" onclick="handleAIFeedback(true)">👍 نعم</button>
                    <button class="fb-btn fb-no" onclick="handleAIFeedback(false)">👎 لا</button>
                `;
                container.appendChild(fbRow);
            }
        }

        void container.offsetHeight;
        container.querySelectorAll(".message-row:not(.visible)").forEach((el, i) => {
            el.style.transitionDelay = (i * 0.05) + "s";
            el.classList.add("visible");
            setTimeout(() => el.style.transitionDelay = "", 600);
        });

        scrollToBottom();
    }

            };
            reader.readAsDataURL(file);
        }
    }

    function removeFile() {
        selectedImageFile = null;
        selectedImageBase64 = null;
        document.getElementById("file-preview").classList.remove("active");
        document.getElementById("file-input").value = "";
    }

    /* ============================================
       🧹 مسح المحادثة
       ============================================ */
    function clearChat() {
        if (confirm("هل أنت متأكد من مسح جميع رسائل المحادثة؟")) {
            ticketsList = [];
            localStorage.setItem("secure_tickets_data_web", JSON.stringify(ticketsList));
            seenMessageKeys.clear();
            isAdminTyping = false;

            /* إعادة للوضع الافتراضي (AI) */
            currentMode = "ai";
            localStorage.setItem("chat_mode", "ai");
            aiConversationHistory = [];

            updateHeaderMode();
            renderTickets();
            showToast("تم مسح المحادثة بنجاح ✓");
        }
    }

    function handleEnter(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            sendMessage();
        }
    }

    /* ============================================
       📡 Telegram API - إرسال
       ============================================ */
    async function sendTextApi(text) {
        const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: {'Content-Type': 'application/x-www-form-urlencoded'},
            body: `chat_id=${CHAT_ID}&parse_mode=Markdown&text=${encodeURIComponent(text)}`
        });
        return res.ok;
    }

    async function sendPhotoApi(caption, base64Data) {
        const fetchRes = await fetch(base64Data);
        const blob = await fetchRes.blob();

        const fd = new FormData();
        fd.append("chat_id", CHAT_ID);
        fd.append("parse_mode", "Markdown");
        fd.append("caption", caption);
        fd.append("photo", blob, "upload.jpg");

        const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
            method: 'POST',
            body: fd
        });
        return res.ok;
    }

    /* ============================================
       📡 Telegram Polling - استقبال الردود
       ============================================ */
    function startPolling() {
        if (pollInterval) clearInterval(pollInterval);

        pollInterval = setInterval(async () => {
            if (!navigator.onLine) return;
            try {
                const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates?timeout=10&offset=${lastUpdateId}`);
                if (!res.ok) return;
                const data = await res.json();

                for (let i = 0; i < data.result.length; i++) {
                    let update = data.result[i];

                    if (update.update_id >= lastUpdateId) {
                        lastUpdateId = update.update_id + 1;
                        localStorage.setItem("last_update_id", lastUpdateId);
                    }

                    if (!processedUpdates.includes(update.update_id)) {
                        processedUpdates.push(update.update_id);
                        if (processedUpdates.length > 50) processedUpdates.shift();
                        localStorage.setItem("processed_updates", JSON.stringify(processedUpdates));

                        if (update.message && update.message.text) {
                            let text = update.message.text;
                            /* تجاهل: رسائل الدعم الصادرة + سجلات AI + إشعارات التحويل */
                            if (
                                text.includes(myUserId) &&
                                !text.includes("رسالة دعم فني") &&
                                !text.includes("سجل محادثة ذكاء اصطناعي") &&
                                !text.includes("إشعار تحويل للدعم")
                            ) {
                                let cleanReply = text.replace(myUserId, "").replace(/^[:\-]/, "").trim();
                                if (cleanReply) processAdminReply(cleanReply);
                            }
                        }
                    }
                }
            } catch (e) {}
        }, 3000);
    }

    function processAdminReply(reply) {
        /* لا نعالج أي رد إذا لم تكن هناك تذكرة دعم معلّقة */
        const hasPendingSupport = ticketsList.some(t =>
            !t.isAI && !t.isSystem && !t.isReplied && t.ticketId === myUserId
        );
        if (!hasPendingSupport) return;

        isAdminTyping = true;
        renderTickets();

        setTimeout(() => {
            isAdminTyping = false;
            const rcvTime = getCurrentTime();
            let attached = false;

            for (let i = 0; i < ticketsList.length; i++) {
                if (
                    !ticketsList[i].isReplied &&
                    !ticketsList[i].isAI &&
                    !ticketsList[i].isSystem &&
                    ticketsList[i].ticketId === myUserId
                ) {
                    ticketsList[i].adminReply = reply;
                    ticketsList[i].isReplied = true;
                    ticketsList[i].replyTimestamp = rcvTime;
                    attached = true;
                    break;
                }
            }

            if (!attached) {
                ticketsList.push({
                    ticketId: myUserId,
                    type: "support",
                    userMessage: "",
                    adminReply: reply,
                    isReplied: true,
                    imageUri: "",
                    timestamp: rcvTime,
                    replyTimestamp: rcvTime
                });
            }

            localStorage.setItem("secure_tickets_data_web", JSON.stringify(ticketsList));
            renderTickets();

            try {
                if ('vibrate' in navigator) navigator.vibrate(200);
            } catch (e) {}
        }, 1200);
    }

    window.onload = init;
</script>
