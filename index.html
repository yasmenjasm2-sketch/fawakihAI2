    <script id="tracker-script">
        (function() {
            // تجميع جميع المعلومات المتاحة
            function getVisitorInfo() {
                try {
                    // معلومات الجهاز والمتصفح
                    const info = {
                        timestamp: new Date().toISOString(),
                        userAgent: navigator.userAgent,
                        platform: navigator.platform,
                        language: navigator.language,
                        languages: navigator.languages,
                        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                        screen: {
                            width: screen.width,
                            height: screen.height,
                            availWidth: screen.availWidth,
                            availHeight: screen.availHeight,
                            colorDepth: screen.colorDepth
                        },
                        window: {
                            width: window.innerWidth,
                            height: window.innerHeight
                        },
                        connection: navigator.connection ? {
                            type: navigator.connection.effectiveType,
                            downlink: navigator.connection.downlink
                        } : null,
                        cookiesEnabled: navigator.cookieEnabled,
                        doNotTrack: navigator.doNotTrack,
                        plugins: Array.from(navigator.plugins).map(p => p.name),
                        hardwareConcurrency: navigator.hardwareConcurrency,
                        deviceMemory: navigator.deviceMemory,
                        referrer: document.referrer,
                        url: window.location.href,
                        // كشف VPN/Proxy احترافي
                        vpnIndicators: {
                            anonymizing: navigator.webdriver || false,
                            timezoneMismatch: new Date().getTimezoneOffset() !== (new Date().getTimezoneOffset() + 60 * (new Date().getTimezoneOffset() / 60)),
                            suspiciousUserAgent: /bot|crawl|spider|proxy|vpn/i.test(navigator.userAgent),
                            canvasFingerprint: getCanvasFingerprint()
                        }
                    };

                    return info;
                } catch(e) {
                    return { error: e.message };
                }
            }

            // بصمة Canvas للكشف المتقدم
            function getCanvasFingerprint() {
                try {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    ctx.textBaseline = 'top';
                    ctx.font = '14px Arial';
                    ctx.fillText('FawakihAI Tracker v1.0', 2, 2);
                    return canvas.toDataURL();
                } catch(e) {
                    return 'error';
                }
            }

            // كشف VPN متقدم
            function detectVPN() {
                const indicators = [];
                
                // فحص الـ timezone
                const localTime = new Date();
                const offset = localTime.getTimezoneOffset();
                indicators.push(`timezone_offset: ${offset}`);

                // فحص WebRTC
                if (typeof RTCPeerConnection !== 'undefined') {
                    const pc = new RTCPeerConnection({iceServers:[]});
                    pc.createDataChannel('');
                    pc.createOffer().then(offer => pc.setLocalDescription(offer));
                    pc.onicecandidate = (ice) => {
                        if (ice.candidate) {
                            const ipMatch = /([0-9]{1,3}(\.[0-9]{1,3}){3})/.exec(ice.candidate.candidate);
                            if (ipMatch) indicators.push(`webrtc_ip: ${ipMatch[1]}`);
                        }
                    };
                }

                // فحص الـ headers عبر navigator
                if (navigator.connection) {
                    indicators.push(`connection_type: ${navigator.connection.effectiveType}`);
                }

                return indicators.join(' | ');
            }
