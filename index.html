<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hamza Elhumada - FawakihAI</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- نقل التصميم الكامل (CSS) --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', sans-serif; /* تغيير الخط لنفس خط التصميم الثاني */
            background: radial-gradient(circle at top, #1a1a1a, #000000); /* نفس الخلفية */
            color: #e0e0e0;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.7;
            padding-bottom: 20px;
            overflow-x: hidden;
            justify-content: center; /* توسيط عمودي */
        }

        /* تنسيق اسم المطور وعلامة التوثيق */
        .developer-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 25px 0;
            margin-bottom: 5px;
        }

        .developer-name {
            font-size: 1.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: sans-serif; 
            background: linear-gradient(270deg, #0000FF, #8B0000, #00008B, #0000FF);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientAnim 4s ease infinite;
        }

        /* تصميم علامة التوثيق الزرقاء */
        .verified-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            filter: drop-shadow(0 0 8px rgba(29, 161, 242, 0.6));
            animation: pulse-badge 2s infinite;
        }

        .verified-badge svg {
            width: 100%;
            height: 100%;
        }

        @keyframes gradientAnim {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes pulse-badge {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* الحاوية الرئيسية (بديل box القديم بنفس تصميم الجديد) */
        .container {
            width: 90%;
            max-width: 450px; /* تعديل بسيط ليناسب المحتوى القليل */
            margin: 0 auto;
            background: rgba(20, 20, 20, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 35px;
            border-radius: 25px;
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
            backdrop-filter: blur(5px);
        }

        h1 {
            font-size: 2.2rem;
            color: #fff;
            margin-bottom: 5px;
            font-weight: 800;
        }

        p {
            color: #ccc;
            margin-bottom: 20px;
        }

        /* زر التحميل (نفس تصميم الكود الثاني تماماً) */
        .download-btn {
            display: block;
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, #2b5876 0%, #4e4376 100%);
            color: white;
            text-decoration: none;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(78, 67, 118, 0.4);
            transition: all 0.3s ease;
            margin: 20px 0;
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .download-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(78, 67, 118, 0.6);
            background: linear-gradient(135deg, #356b8f 0%, #5f5291 100%);
        }

        .download-btn::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
        }
        .download-btn:hover::after {
            left: 100%;
        }

        /* روابط التواصل */
        .social-area {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #333;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
        }

        .social-btn {
            width: 55px;
            height: 55px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
            text-decoration: none;
            transition: transform 0.3s;
        }

        .whatsapp { background: #25D366; box-shadow: 0 0 15px rgba(37,211,102,0.2); }
        .instagram { background: linear-gradient(45deg, #833ab4, #fd1d1d, #fcb045); box-shadow: 0 0 15px rgba(253,29,29,0.2); }

        .social-btn:hover { transform: translateY(-5px); }

        /* التذييل */
        footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #555;
        }
    </style>
</head>

            </svg>

        <span class="developer-name">Hamza Elhumada</span>

    <div class="container">

    </div>

    <footer>
        <p>جميع الحقوق محفوظة © 2026 <strong>Hamza Elhumada</strong></p>
