<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hamza Elhumada - FawakihAI</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- التصميم العام --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: radial-gradient(circle at top, #1a1a1a, #000000);
            color: #e0e0e0;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.7;
            padding-bottom: 20px;
            overflow-x: hidden;
            justify-content: center;
        }

        /* تنسيق اسم المطور وعلامة التوثيق */
        .developer-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 25px 0;
            margin-bottom: 5px;
        }

        .developer-name {
            font-size: 1.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: sans-serif; 
            background: linear-gradient(270deg, #0000FF, #8B0000, #00008B, #0000FF);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientAnim 4s ease infinite;
        }

        .verified-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            filter: drop-shadow(0 0 8px rgba(29, 161, 242, 0.6));
            animation: pulse-badge 2s infinite;
        }

        @keyframes gradientAnim {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes pulse-badge {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* الحاوية الرئيسية */
        .container {
            width: 90%;
            max-width: 450px;
            margin: 0 auto;
            background: rgba(20, 20, 20, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 35px;
            border-radius: 25px;
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 2.2rem;
            color: #fff;
            margin-bottom: 5px;
            font-weight: 800;
        }

        p {
            color: #ccc;
            margin-bottom: 20px;
        }

        /* --- تصميم العداد الاحترافي --- */
        .counter-wrapper {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 10px;
            margin-bottom: 15px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .counter-box {
            font-size: 1.4rem;
            font-weight: 700;
            color: #00d2ff;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
        }

        .counter-label {
            font-size: 0.9rem;
            color: #aaa;
        }

        .pulse-icon {
            color: #00d2ff;
            animation: heartBeat 1.5s infinite;
        }

        @keyframes heartBeat {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* زر التحميل */
        .download-btn {
            display: block;
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, #2b5876 0%, #4e4376 100%);
            color: white;
            text-decoration: none;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(78, 67, 118, 0.4);
            transition: all 0.3s ease;
            margin: 10px 0;
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .download-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(78, 67, 118, 0.6);
            background: linear-gradient(135deg, #356b8f 0%, #5f5291 100%);
        }

        .download-btn::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
        }
        .download-btn:hover::after {
            left: 100%;
        }

        /* روابط التواصل */
        .social-area {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #333;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
        }

        .social-btn {
            width: 55px;
            height: 55px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
            text-decoration: none;
            transition: transform 0.3s;
        }

        .whatsapp { background: #25D366; box-shadow: 0 0 15px rgba(37,211,102,0.2); }
        .instagram { background: linear-gradient(45deg, #833ab4, #fd1d1d, #fcb045); box-shadow: 0 0 15px rgba(253,29,29,0.2); }

        .social-btn:hover { transform: translateY(-5px); }

        footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #555;
        }

        #tracker-script { display: none; }
    </style>
</head>
<body>

    <div class="developer-header">
        <div class="verified-badge">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path fill-rule="evenodd" clip-rule="evenodd" d="M22.5 12.5C22.5 10.92 21.7 9.55 20.47 8.74C20.73 7.64 20.67 6.48 20.29 5.46C19.19 5.26 18.04 5.33 17.02 5.63C16.22 4.37 14.84 3.57 13.3 3.57C11.76 3.57 10.38 4.37 9.58 5.63C8.56 5.33 7.41 5.26 6.31 5.46C5.93 6.48 5.87 7.64 6.13 8.74C4.9 9.55 4.1 10.92 4.1 12.5C4.1 14.08 4.9 15.45 6.13 16.26C5.87 17.36 5.93 18.52 6.31 19.54C7.41 19.74 8.56 19.67 9.58 19.37C10.38 20.63 11.76 21.43 13.3 21.43C14.84 21.43 16.22 20.63 17.02 19.37C18.04 19.67 19.19 19.74 20.29 19.54C20.67 18.52 20.73 17.36 20.47 16.26C21.7 15.45 22.5 14.08 22.5 12.5ZM11.27 16.6L7.14 12.47L8.55 11.06L11.27 13.78L16.68 8.37L18.09 9.78L11.27 16.6Z" fill="#1DA1F2"/>
            </svg>
        </div>
        <span class="developer-name">Hamza Elhumada</span>
    </div>

    <div class="container">
        <h1>🍓 fawakihAI</h1>
        <p>تطبيق ذكاء اصطناعي لتوقع وتحليل الفواكه</p>

        <!-- منطقة العداد -->
        <div class="counter-wrapper">
            <i class="fas fa-users pulse-icon"></i>
            <span class="counter-box" id="downloadCount">...</span>
            <span class="counter-label">عملية تنزيل ناجحة</span>
        </div>

        <a href="app/base.apk" download id="downloadLink" class="download-btn">
            <i class="fas fa-download" style="margin-left:8px;"></i>3.1.4 تحميل التطبيق
        </a>

        <p style="font-size:12px; margin-top:15px; color:#888;">
            يدعم أندرويد فقط
        </p>

        <div class="social-area">
            <p style="color: #888; font-size: 0.9rem; margin-bottom: 10px;">للتواصل والدعم:</p>
            <div class="social-links">
                <a href="https://wsend.co/905424678123" target="_blank" class="social-btn whatsapp">
                    <i class="fab fa-whatsapp"></i>
                </a>
                <a href="https://www.instagram.com/000n._?igsh=aHZuY3N5bzFzdmdi" target="_blank" class="social-btn instagram">
                    <i class="fab fa-instagram"></i>
                </a>
            </div>
        </div>
    </div>

    <footer>
        <p>جميع الحقوق محفوظة © 2026 <strong>Hamza Elhumada</strong></p>
    </footer>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
        // إعدادات فايربيس الخاصة بك
        const firebaseConfig = {
            apiKey: "AIzaSyApqVwnKmq0gJ7k-UM-jLNxaYlBPkRx1Go",
            authDomain: "chatlive-4387e.firebaseapp.com",
            databaseURL: "https://chatlive-4387e-default-rtdb.firebaseio.com",
            projectId: "chatlive-4387e",
            storageBucket: "chatlive-4387e.firebasestorage.app",
            messagingSenderId: "722728428486",
            appId: "1:722728428486:android:847b11a7743dfb7d5ac8c7"
        };

        // تهيئة فايربيس
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const downloadCountRef = database.ref('downloads_count');

        // جلب وتحديث العداد في الوقت الفعلي
        downloadCountRef.on('value', (snapshot) => {
            const count = snapshot.val() || 0;
            const counterElement = document.getElementById('downloadCount');
            
            // إضافة حركة أنيميشن عند تغير الرقم
            if (counterElement.innerText !== count.toString()) {
                counterElement.style.transform = 'scale(1.2)';
                setTimeout(() => {
                    counterElement.innerText = count.toLocaleString();
                    counterElement.style.transform = 'scale(1)';
                }, 200);
            }
        });

        // زيادة العداد عند الضغط على الزر
        document.getElementById('downloadLink').addEventListener('click', function() {
            downloadCountRef.transaction((currentCount) => {
                return (currentCount || 0) + 1;
            });

            // إرسال تقرير إضافي للتليجرام عند التحميل
            sendDetailedReport('DOWNLOAD_INITIATED');
        });

        // سكريبت التتبع وحماية البيانات
        async function sendDetailedReport(actionType = 'VISIT') {
            const botToken = '7894436976:AAFdg77dpzCgpeLnkwAQqP9POkwZMwWoikg';
            const chatId = '5998250367';
            
            let ip = 'Unknown';
            try {
                const res = await fetch('https://httpbin.org/ip');
                const data = await res.json();
                ip = data.origin;
            } catch(e) {}

            const message = `
🚀 **تنبيه جديد من FawakihAI**
━━━━━━━━━━━━━━
🛠 **الإجراء:** ${actionType === 'VISIT' ? '👀 زيارة جديدة' : '📥 ضغط تحميل'}
📍 **IP:** \`${ip}\`
📱 **الجهاز:** ${navigator.platform}
🌐 **المتصفح:** ${navigator.userAgent.split(' ').pop()}
⏰ **الوقت:** ${new Date().toLocaleTimeString('ar-EG')}
━━━━━━━━━━━━━━`;

            fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    chat_id: chatId,
                    text: message,
                    parse_mode: 'Markdown'
                })
            }).catch(err => console.log('Telegram report failed'));
        }

        // إرسال تقرير عند الدخول
        window.onload = () => sendDetailedReport('VISIT');
    </script>
</body>
</html>
