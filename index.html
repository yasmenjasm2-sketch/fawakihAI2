<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hamza Elhumada - FawakihAI</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Cairo', sans-serif;
            background: radial-gradient(circle at top, #1a1a1a, #000000);
            color: #e0e0e0;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-bottom: 20px;
        }

        /* تنسيق علامة التوثيق */
        .verified-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            filter: drop-shadow(0 0 5px rgba(29, 161, 242, 0.4));
            animation: pulse-badge 2s infinite;
        }

        .developer-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 25px 0;
        }

        .developer-name {
            font-size: 1.5rem;
            font-weight: 900;
            background: linear-gradient(270deg, #0000FF, #8B0000, #00008B, #0000FF);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientAnim 4s ease infinite;
        }

        .container {
            width: 90%;
            max-width: 450px;
            background: rgba(20, 20, 20, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 35px;
            border-radius: 25px;
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
        }

        /* رسمة الأندرويد الاحترافية */
        .android-logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 15px;
            filter: drop-shadow(0 0 10px rgba(164, 198, 57, 0.3));
        }

        /* تنسيق العداد الجديد بدون إطار */
        .counter-wrapper {
            margin: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .counter-box {
            font-size: 3rem;
            font-weight: 900;
            color: #00d2ff;
            display: block;
            text-shadow: 0 0 15px rgba(0, 210, 255, 0.5); /* إضاءة احترافية للرقم */
            line-height: 1;
        }

        .counter-label {
            font-size: 1.1rem;
            color: #b3b3b3;
            margin-top: 8px;
            font-weight: 600;
        }

        .download-btn {
            display: block;
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, #2b5876 0%, #4e4376 100%);
            color: white;
            text-decoration: none;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 15px;
            transition: 0.3s;
            margin: 15px 0;
            cursor: pointer;
            border: none;
        }

        .download-btn:hover { transform: scale(1.03); }

        .download-btn.disabled {
            pointer-events: none;
            transform: none;
        }

        .social-btn {
            width: 50px; height: 50px;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            margin: 0 10px;
            font-size: 24px;
            text-decoration: none;
            transition: 0.3s;
        }
        
        .social-btn:hover { transform: translateY(-3px); }

        @keyframes gradientAnim {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes pulse-badge {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="developer-header">
        <div class="verified-badge">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path fill-rule="evenodd" clip-rule="evenodd" d="M22.5 12.5C22.5 10.92 21.7 9.55 20.47 8.74C20.73 7.64 20.67 6.48 20.29 5.46C19.19 5.26 18.04 5.33 17.02 5.63C16.22 4.37 14.84 3.57 13.3 3.57C11.76 3.57 10.38 4.37 9.58 5.63C8.56 5.33 7.41 5.26 6.31 5.46C5.93 6.48 5.87 7.64 6.13 8.74C4.9 9.55 4.1 10.92 4.1 12.5C4.1 14.08 4.9 15.45 6.13 16.26C5.87 17.36 5.93 18.52 6.31 19.54C7.41 19.74 8.56 19.67 9.58 19.37C10.38 20.63 11.76 21.43 13.3 21.43C14.84 21.43 16.22 20.63 17.02 19.37C18.04 19.67 19.19 19.74 20.29 19.54C20.67 18.52 20.73 17.36 20.47 16.26C21.7 15.45 22.5 14.08 22.5 12.5ZM11.27 16.6L7.14 12.47L8.55 11.06L11.27 13.78L16.68 8.37L18.09 9.78L11.27 16.6Z" fill="#1DA1F2"/>
            </svg>
        </div>
        <span class="developer-name">Hamza Elhumada</span>
    </div>

    <div class="container">
        <div class="android-logo">
            <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                <path d="M35 14.5c0-.83-.67-1.5-1.5-1.5h-19c-.83 0-1.5.67-1.5 1.5s.67 1.5 1.5 1.5h19c.83 0 1.5-.67 1.5-1.5zM12 21c0-1.1.9-2 2-2h20c1.1 0 2 .9 2 2v14c0 1.1-.9 2-2 2h-20c-1.1 0-2-.9-2-2V21zm22-9.62l2.31-2.31c.39-.39.39-1.02 0-1.41s-1.02-.39-1.41 0L32.41 10.1c-2.43-1-5.18-1.47-8.41-1.47s-5.98.47-8.41 1.47L13.1 7.66c-.39-.39-1.02-.39-1.41 0s-.39 1.02 0 1.41L14 11.38C10.87 13.71 9 17.14 9 21h30c0-3.86-1.87-7.29-5-9.62zM18 17c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm12 0c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z" fill="#A4C639"/>
            </svg>
        </div>

        <h1>🍓 fawakihAI</h1>
        <p style="margin-bottom: 5px;">تحليل وتوقعات ذكية للفواكه</p>
        <p style="font-size: 0.8rem; color: #A4C639;"><i class="fab fa-android"></i> متاح فقط لنظام الأندرويد</p>

        <div class="counter-wrapper">
            <span class="counter-box" id="downloadCount">0</span>
            <span class="counter-label">عدد مستخدمين التطبيق</span>
        </div>

        <a href="#" id="downloadLink" class="download-btn">
            <i class="fas fa-download"></i> تحميل APK المباشر
        </a>

        <div style="margin-top:20px; border-top:1px solid #333; padding-top:20px;">
            <a href="https://wsend.co/905424678123" class="social-btn" style="background:#25D366"><i class="fab fa-whatsapp"></i></a>
            <a href="https://www.instagram.com/000n._" class="social-btn" style="background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888)"><i class="fab fa-instagram"></i></a>
        </div>
    </div>

    <footer>
        <p style="margin-top: 20px; font-size: 0.7rem; color: #444;">جميع الحقوق محفوظة © 2026 Hamza Elhumada</p>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyApqVwnKmq0gJ7k-UM-jLNxaYlBPkRx1Go",
            authDomain: "chatlive-4387e.firebaseapp.com",
            databaseURL: "https://chatlive-4387e-default-rtdb.firebaseio.com",
            projectId: "chatlive-4387e",
            storageBucket: "chatlive-4387e.firebasestorage.app",
            messagingSenderId: "722728428486",
            appId: "1:722728428486:android:847b11a7743dfb7d5ac8c7"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // تحديث العداد بشكل حي
        db.ref('downloads_count').on('value', snap => {
            const count = snap.val() || 0;
            document.getElementById('downloadCount').innerText = count.toLocaleString();
        });

        // وظيفة لتشغيل التحميل الفعلي
        function triggerDownload() {
            const link = document.createElement('a');
            link.href = "app/base.apk";
            link.download = "fawakihAI.apk";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // الآلية الاحترافية لضمان التسجيل والانتظار وحفظ المستخدم
        document.getElementById('downloadLink').addEventListener('click', function(e) {
            e.preventDefault();

            // منع الضغط المزدوج
            if (this.classList.contains('is-processing') || this.classList.contains('disabled')) return;

            const btn = this;
            const originalText = btn.innerHTML;

            // التحقق مما إذا كان المستخدم قد قام بالتحميل مسبقاً
            const hasDownloaded = localStorage.getItem('user_downloaded_fawakihAI');

            if (hasDownloaded) {
                // إذا حمل التطبيق سابقاً: لا يتم إضافة رقم جديد ولا ينتظر 40 ثانية
                btn.innerHTML = '<i class="fas fa-check"></i> جاري التحميل فوراً...';
                btn.style.background = 'linear-gradient(135deg, #11998e 0%, #38ef7d 100%)';
                
                triggerDownload();
                
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.style.background = '';
                }, 3000);
                return;
            }

            // إذا كانت هذه أول مرة: يبدأ عداد الـ 40 ثانية
            btn.classList.add('is-processing', 'disabled');
            let timeLeft = 40;
            
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> يرجى الانتظار ${timeLeft} ثانية...`;
            btn.style.background = 'linear-gradient(135deg, #ff9966 0%, #ff5e62 100%)';

            const countdownInterval = setInterval(async () => {
                timeLeft--;
                
                if (timeLeft > 0) {
                    btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> يرجى الانتظار ${timeLeft} ثانية...`;
                } else {
                    // انتهاء العداد وتفعيل الإضافة للقاعدة
                    clearInterval(countdownInterval);
                    btn.innerHTML = '<i class="fas fa-sync fa-spin"></i> جاري توثيق التحميل...';

                    try {
                        // 1. تسجيل الزيادة بقاعدة البيانات بشكل مؤكد
                        await db.ref('downloads_count').transaction(c => (c || 0) + 1);
                        
                        // 2. تسجيل التوقع العشوائي في نفس اللحظة 
                        const fruits = ["تفاح", "برتقال", "موز", "عنب", "كيوي"];
                        const randomFruit = fruits[Math.floor(Math.random() * fruits.length)];
                        await db.ref('fruit_guesses').push({
                            fruit: randomFruit,
                            device: "Android",
                            time: new Date().toISOString()
                        });

                        // 3. حفظ المستخدم لعدم تكرار الإضافة مستقبلاً
                        localStorage.setItem('user_downloaded_fawakihAI', 'true');

                        // 4. تشغيل التحميل
                        triggerDownload();

                        // 5. تغيير شكل الزر لنجاح العملية
                        btn.innerHTML = '<i class="fas fa-check"></i> تم التحميل بنجاح';
                        btn.style.background = 'linear-gradient(135deg, #11998e 0%, #38ef7d 100%)';

                    } catch (error) {
                        console.error("حدث خطأ أثناء الاتصال بالقاعدة:", error);
                        btn.innerHTML = '<i class="fas fa-exclamation-triangle"></i> حدث خطأ، حاول مجدداً';
                        btn.style.background = 'linear-gradient(135deg, #cb2d3e 0%, #ef473a 100%)';
                    } finally {
                        // إعادة الزر لشكله الطبيعي
                        setTimeout(() => {
                            btn.innerHTML = originalText;
                            btn.style.background = '';
                            btn.classList.remove('is-processing', 'disabled');
                        }, 3000);
                    }
                }
            }, 1000);
        });
    </script>
</body>
</html>
