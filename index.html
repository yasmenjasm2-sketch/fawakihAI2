    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Cairo', sans-serif;
            background: radial-gradient(circle at top, #1a1a1a, #000000);
            color: #e0e0e0;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-bottom: 20px;
        }

        /* العداد العلوي الاحترافي بدون إطار */
        .top-counter {
            margin-bottom: 30px;
            animation: fadeInDown 1s ease;
        }

        .counter-number {
            font-size: 3rem;
            font-weight: 900;
            color: #00d2ff;
            text-shadow: 0 0 20px rgba(0, 210, 255, 0.5);
            line-height: 1;
        }

        .counter-label {
            font-size: 1.1rem;
            color: #888;
            letter-spacing: 1px;
            margin-top: 5px;
            display: block;
        }

        /* علامة التوثيق */
        .verified-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            filter: drop-shadow(0 0 5px rgba(29, 161, 242, 0.4));
            animation: pulse-badge 2s infinite;
        }

        .developer-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 10px 0 25px;
        }

        .developer-name {
            font-size: 1.5rem;
            font-weight: 900;
            background: linear-gradient(270deg, #0000FF, #8B0000, #00008B, #0000FF);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientAnim 4s ease infinite;
        }

        .container {
            width: 90%;
            max-width: 450px;
            background: rgba(20, 20, 20, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 35px;
            border-radius: 30px;
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
            backdrop-filter: blur(15px);
            position: relative;
            overflow: hidden;
        }

        /* رسمة الأندرويد */
        .android-logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 15px;
            filter: drop-shadow(0 0 12px rgba(164, 198, 57, 0.4));
        }

        .download-btn {
            display: block;
            width: 100%;
            padding: 22px;
            background: linear-gradient(135deg, #2b5876 0%, #4e4376 100%);
            color: white;
            text-decoration: none;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 18px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin: 20px 0;
            cursor: pointer;
            border: none;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .download-btn:active { transform: scale(0.95); }
        .download-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 25px rgba(0,0,0,0.4); }

        .social-btn {
            width: 50px; height: 50px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            margin: 0 10px;
            font-size: 24px;
            text-decoration: none;
            transition: 0.3s;
        }
        
        .social-btn:hover { transform: rotate(10deg) scale(1.1); }

        /* الأنيميشن */
        @keyframes gradientAnim {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes pulse-badge {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
