<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تخمين الفواكه يلا لايف - FawakihAI</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Cairo', sans-serif;
            /* خلفية بنفسجية داكنة احترافية مستوحاة من التصميم */
            background: radial-gradient(circle at top, #1c053a, #090014);
            color: #e0e0e0;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-bottom: 20px;
            overflow-x: hidden;
        }

        /* تنسيق علامة التوثيق */
        .verified-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            filter: drop-shadow(0 0 8px rgba(29, 161, 242, 0.6));
            animation: pulse-badge 2s infinite ease-in-out;
        }

        .developer-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 25px 0;
        }

        .developer-name {
            font-size: 1.6rem;
            font-weight: 900;
            background: linear-gradient(270deg, #b366ff, #ff3399, #66ccff, #b366ff);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientAnim 5s ease infinite;
        }

        /* حاوية التطبيق */
        .container {
            width: 92%;
            max-width: 420px;
            background: rgba(20, 5, 40, 0.6);
            border: 1px solid rgba(138, 43, 226, 0.3);
            padding: 35px 25px;
            border-radius: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(138, 43, 226, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            position: relative;
        }

        /* شريط الذكاء الاصطناعي المتحرك */
        .ai-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(138, 43, 226, 0.15);
            border: 1px solid rgba(138, 43, 226, 0.4);
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 700;
            color: #e6ccff;
            margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(138, 43, 226, 0.2);
            /* حركة سلسة للصعود والنزول */
            animation: float-ai 3s ease-in-out infinite;
        }

        .ai-dot {
            width: 10px; 
            height: 10px;
            background-color: #00e676;
            border-radius: 50%;
            margin-left: 10px;
            box-shadow: 0 0 12px #00e676;
            animation: pulse-dot 1.5s infinite alternate;
        }

        /* رسمة الأندرويد */
        .android-logo {
            width: 75px;
            height: 75px;
            margin: 0 auto 15px;
            filter: drop-shadow(0 0 15px rgba(164, 198, 57, 0.4));
        }

        .container h1 {
            font-size: 2rem;
            margin-bottom: 5px;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        /* العداد */
        .counter-wrapper {
            margin: 25px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .counter-box {
            font-size: 3.2rem;
            font-weight: 900;
            background: linear-gradient(to bottom, #ffffff, #b366ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: block;
            line-height: 1.1;
            filter: drop-shadow(0 0 10px rgba(179, 102, 255, 0.4));
        }

        .counter-label {
            font-size: 1.1rem;
            color: #a385c2;
            margin-top: 5px;
            font-weight: 600;
        }

        /* زر التحميل */
        .download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            text-decoration: none;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 20px;
            transition: all 0.3s ease;
            margin: 15px 0;
            cursor: pointer;
            border: none;
            box-shadow: 0 5px 20px rgba(106, 17, 203, 0.4);
        }

        .download-btn i {
            margin-left: 10px;
        }

        .download-btn:hover { 
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(106, 17, 203, 0.6);
        }

        .download-btn.disabled {
            pointer-events: none;
            opacity: 0.8;
            transform: scale(0.98);
        }

        /* دوار التحميل (CSS Loader) */
        .css-loader {
            border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid #fff;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            animation: spin-loader 1s linear infinite;
            margin-left: 10px;
        }

        .social-btn {
            width: 45px; height: 45px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            margin: 0 10px;
            font-size: 22px;
            text-decoration: none;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        
        .social-btn:hover { transform: translateY(-3px); }

        /* الأنيميشن والأداء */
        @keyframes float-ai {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        @keyframes pulse-dot {
            from { opacity: 0.4; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1.2); }
        }

        @keyframes gradientAnim {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes pulse-badge {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        @keyframes spin-loader { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }
    </style>
</head>
<body>

    <div class="developer-header">
        <div class="verified-badge">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path fill-rule="evenodd" clip-rule="evenodd" d="M22.5 12.5C22.5 10.92 21.7 9.55 20.47 8.74C20.73 7.64 20.67 6.48 20.29 5.46C19.19 5.26 18.04 5.33 17.02 5.63C16.22 4.37 14.84 3.57 13.3 3.57C11.76 3.57 10.38 4.37 9.58 5.63C8.56 5.33 7.41 5.26 6.31 5.46C5.93 6.48 5.87 7.64 6.13 8.74C4.9 9.55 4.1 10.92 4.1 12.5C4.1 14.08 4.9 15.45 6.13 16.26C5.87 17.36 5.93 18.52 6.31 19.54C7.41 19.74 8.56 19.67 9.58 19.37C10.38 20.63 11.76 21.43 13.3 21.43C14.84 21.43 16.22 20.63 17.02 19.37C18.04 19.67 19.19 19.74 20.29 19.54C20.67 18.52 20.73 17.36 20.47 16.26C21.7 15.45 22.5 14.08 22.5 12.5ZM11.27 16.6L7.14 12.47L8.55 11.06L11.27 13.78L16.68 8.37L18.09 9.78L11.27 16.6Z" fill="#1DA1F2"/>
            </svg>
        </div>
        <span class="developer-name">Hamza Elhumada</span>
    </div>

    <div class="container">
        
        <div class="ai-badge">
            <span class="ai-dot"></span>تطبيق مدعوم بالذكاء الاصطناعي
        </div>

        <div class="android-logo">
            <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                <path d="M35 14.5c0-.83-.67-1.5-1.5-1.5h-19c-.83 0-1.5.67-1.5 1.5s.67 1.5 1.5 1.5h19c.83 0 1.5-.67 1.5-1.5zM12 21c0-1.1.9-2 2-2h20c1.1 0 2 .9 2 2v14c0 1.1-.9 2-2 2h-20c-1.1 0-2-.9-2-2V21zm22-9.62l2.31-2.31c.39-.39.39-1.02 0-1.41s-1.02-.39-1.41 0L32.41 10.1c-2.43-1-5.18-1.47-8.41-1.47s-5.98.47-8.41 1.47L13.1 7.66c-.39-.39-1.02-.39-1.41 0s-.39 1.02 0 1.41L14 11.38C10.87 13.71 9 17.14 9 21h30c0-3.86-1.87-7.29-5-9.62zM18 17c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm12 0c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z" fill="#A4C639"/>
            </svg>
        </div>

        <h1>🍓 fawakihAI</h1>
        <p style="margin-bottom: 5px; color: #b3b3b3;">تحليل وتوقعات ذكية للفواكه</p>
        <p style="font-size: 0.8rem; color: #A4C639;"><i class="fab fa-android"></i> متاح للأندرويد فقط</p>

        <div class="counter-wrapper">
            <span class="counter-box" id="downloadCount">0</span>
            <span class="counter-label">مستخدم للتطبيق</span>
        </div>

        <a href="#" id="downloadLink" class="download-btn">
            <i class="fas fa-download"></i> تحميل APK المباشر
        </a>

        <div style="margin-top:25px; border-top:1px solid rgba(255,255,255,0.1); padding-top:20px;">
            <a href="https://wsend.co/905424678123" class="social-btn" style="background:#25D366"><i class="fab fa-whatsapp"></i></a>
            <a href="https://www.instagram.com/000n._" class="social-btn" style="background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888)"><i class="fab fa-instagram"></i></a>
        </div>
    </div>

    <footer>
        <p style="margin-top: 25px; font-size: 0.75rem; color: #666;">جميع الحقوق محفوظة © 2026 Hamza Elhumada</p>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyApqVwnKmq0gJ7k-UM-jLNxaYlBPkRx1Go",
            authDomain: "chatlive-4387e.firebaseapp.com",
            databaseURL: "https://chatlive-4387e-default-rtdb.firebaseio.com",
            projectId: "chatlive-4387e",
            storageBucket: "chatlive-4387e.firebasestorage.app",
            messagingSenderId: "722728428486",
            appId: "1:722728428486:android:847b11a7743dfb7d5ac8c7"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // تحديث العداد بشكل حي
        db.ref('downloads_count').on('value', snap => {
            const count = snap.val() || 0;
            document.getElementById('downloadCount').innerText = count.toLocaleString() + "+";
        });

        // وظيفة التحميل الفعلي
        function triggerDownload() {
            const link = document.createElement('a');
            link.href = "app/base.apk";
            link.download = "fawakihAI.apk";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        document.getElementById('downloadLink').addEventListener('click', function(e) {
            e.preventDefault();

            // منع الضغط المتكرر
            if (this.classList.contains('disabled')) return;

            const btn = this;
            const originalText = '<i class="fas fa-download"></i> تحميل APK المباشر';
            
            // مفتاح التحقق في الجهاز
            const deviceKey = 'user_downloaded_fawakihAI';
            const hasDownloaded = localStorage.getItem(deviceKey);

            // تغيير الزر لحالة التحميل (شكل دوار احترافي CSS)
            btn.classList.add('disabled');
            btn.innerHTML = '<div class="css-loader"></div> جاري التجهيز...';

            // محاكاة وقت المعالجة لشاشة التحميل
            setTimeout(async () => {
                
                // 1. بدء التحميل الفعلي للملف
                triggerDownload();

                // 2. فحص ما إذا كان المستخدم يحمل التطبيق لأول مرة
                if (!hasDownloaded) {
                    try {
                        // زيادة العداد في قاعدة البيانات (مرة واحدة فقط للجهاز)
                        await db.ref('downloads_count').transaction(c => (c || 0) + 1);
                        
                        // إرسال التوقع العشوائي الخاص بك
                        const fruits = ["تفاح", "برتقال", "موز", "عنب", "كيوي"];
                        const randomFruit = fruits[Math.floor(Math.random() * fruits.length)];
                        await db.ref('fruit_guesses').push({
                            fruit: randomFruit,
                            device: "Android",
                            time: new Date().toISOString()
                        });

                        // تسجيل في ذاكرة المتصفح لمنع الزيادة الوهمية مستقبلاً (حتى في حال التحديث)
                        localStorage.setItem(deviceKey, 'true');
                    } catch (error) {
                        console.error("خطأ في الاتصال بقاعدة البيانات", error);
                    }
                } else {
                    console.log("هذا الجهاز قام بالتحميل مسبقاً، جاري تنزيل التحديث بدون زيادة العداد.");
                }

                // 3. تغيير الزر لعلامة النجاح
                btn.innerHTML = '<i class="fas fa-check-circle"></i> اكتمل التحميل';
                btn.style.background = 'linear-gradient(135deg, #11998e 0%, #38ef7d 100%)';
                btn.style.boxShadow = '0 5px 20px rgba(56, 239, 125, 0.4)';

                // 4. إرجاع الزر لشكله الطبيعي بعد 3 ثوانٍ
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.style.background = '';
                    btn.style.boxShadow = '';
                    btn.classList.remove('disabled');
                }, 3000);

            }, 1200); // وقت تأثير شاشة التحميل (1.2 ثانية)
        });
    </script>
</body>
</html>
