<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طلب خدمات API - fawakihAI</title>
    <meta name="description" content="نموذج طلب خدمات API الخاصة بتطبيق fawakihAI.">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background: radial-gradient(circle at top, #1c053a, #090014);
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .top-bar {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 1000;
        }

        .back-btn {
            background: rgba(20, 5, 40, 0.7);
            border: 1px solid rgba(138, 43, 226, 0.5);
            color: #e6ccff;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .back-btn:hover {
            background: rgba(138, 43, 226, 0.3);
            border-color: rgba(179, 102, 255, 0.8);
            transform: translateY(-2px);
            color: #fff;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: rgba(20, 5, 40, 0.6);
            border: 1px solid rgba(138, 43, 226, 0.3);
            padding: 40px 30px;
            border-radius: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(138, 43, 226, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            text-align: center;
        }

        .icon-header {
            font-size: 3rem;
            color: #b366ff;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(179, 102, 255, 0.6);
            animation: float-icon 3s ease-in-out infinite;
        }

        .container h1 {
            font-size: 1.8rem;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .container p {
            color: #b3a3cc;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        .form-group {
            text-align: right;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            color: #e6ccff;
        }

        .form-control {
            width: 100%;
            padding: 14px 15px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(138, 43, 226, 0.4);
            border-radius: 12px;
            color: #fff;
            font-family: 'Cairo', sans-serif;
            font-size: 0.95rem;
            transition: all 0.3s;
            outline: none;
        }

        .form-control:focus {
            border-color: #ff3399;
            box-shadow: 0 0 15px rgba(255, 51, 153, 0.3);
            background: rgba(20, 5, 40, 0.8);
        }

        select.form-control {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23b366ff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: left 15px center;
            background-size: 15px;
            padding-left: 40px;
        }

        select.form-control option {
            background-color: #1c053a;
            color: #fff;
        }

        textarea.form-control {
            resize: vertical;
            min-height: 100px;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            font-family: 'Cairo', sans-serif;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(106, 17, 203, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(106, 17, 203, 0.6);
        }

        .success-msg {
            display: none;
            background: rgba(0, 230, 118, 0.1);
            border: 1px solid #00e676;
            color: #b3ffcc;
            padding: 15px;
            border-radius: 12px;
            margin-top: 20px;
            font-size: 0.95rem;
            animation: fadeIn 0.5s ease;
        }

        @keyframes float-icon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="index.html" class="back-btn" title="العودة للرئيسية">
            <i class="fas fa-arrow-right"></i>
        </a>
    </div>

    <div class="container">
        <div class="icon-header">
            <i class="fas fa-server"></i>
        </div>
        <h1>طلب خدمة API</h1>
        <p>احصل على مفتاح الوصول الخاص بك لدمج خدمات fawakihAI في مشروعك بكل سهولة.</p>

        <form id="apiForm">
            <div class="form-group">
                <label for="fullName"><i class="fas fa-user"></i> الاسم الكامل / اسم الشركة</label>
                <input type="text" id="fullName" class="form-control" placeholder="أدخل الاسم..." required>
            </div>

            <div class="form-group">
                <label for="email"><i class="fas fa-envelope"></i> البريد الإلكتروني</label>
                <input type="email" id="email" class="form-control" placeholder="example@domain.com" required>
            </div>

            <div class="form-group">
                <label for="phone"><i class="fab fa-whatsapp"></i> رقم واتساب (للتواصل)</label>
                <input type="tel" id="phone" class="form-control" placeholder="+966 5X XXX XXXX" required>
            </div>

            <div class="form-group">
                <label for="projectType"><i class="fas fa-briefcase"></i> نوع المشروع</label>
                <select id="projectType" class="form-control" required>
                    <option value="" disabled selected>-- اختر نوع المشروع --</option>
                    <option value="commercial">مشروع تجاري</option>
                    <option value="local">تطبيق محلي / شخصي</option>
                    <option value="ecommerce">متجر إلكتروني</option>
                    <option value="other">أخرى</option>
                </select>
            </div>

            <div class="form-group">
                <label for="usage"><i class="fas fa-chart-line"></i> حجم الاستخدام المتوقع (شهرياً)</label>
                <select id="usage" class="form-control" required>
                    <option value="" disabled selected>-- اختر الحجم المتوقع --</option>
                    <option value="small">أقل من 10,000 طلب</option>
                    <option value="medium">10,000 إلى 50,000 طلب</option>
                    <option value="large">أكثر من 100,000 طلب (باقة VIP)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="details"><i class="fas fa-info-circle"></i> وصف مختصر للمشروع</label>
                <textarea id="details" class="form-control" placeholder="حدثنا عن مشروعك وكيف تخطط لاستخدام الـ API..."></textarea>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                <i class="fas fa-paper-plane"></i> إرسال الطلب
            </button>

            <div class="success-msg" id="successMsg">
                <i class="fas fa-check-circle"></i> تم إرسال طلبك بنجاح! سيتم التواصل معك قريباً لتزويدك بمفتاح الـ API.
            </div>
        </form>
    </div>

    <script>
        document.getElementById('apiForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const originalText = btn.innerHTML;
            
            // تأثير التحميل عند الضغط
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الإرسال...';
            btn.style.opacity = '0.8';
            btn.style.pointerEvents = 'none';

            // محاكاة إرسال البيانات
            setTimeout(() => {
                document.getElementById('successMsg').style.display = 'block';
                btn.innerHTML = originalText;
                btn.style.opacity = '1';
                btn.style.pointerEvents = 'auto';
                this.reset(); // تفريغ الحقول بعد الإرسال
                
                // إخفاء الرسالة بعد 5 ثواني
                setTimeout(() => {
                    document.getElementById('successMsg').style.display = 'none';
                }, 5000);
            }, 1500);
        });
    </script>
</body>
</html>
